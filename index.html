<style>
  /* ===== Design tokens — Marine Composite =====
     Base : porcelain/off-white surfaces, soft charcoal-navy ink (never pure black).
     Accent : deep marine navy for structure/branding + a muted blue-green ("composite
     resin") for anything interactive, so actions stay easy to spot without shouting.
     Status colours are intentionally desaturated to match the sober brief. */
  :root{
    --navy:#0B2340; --navy-dark:#071A30; --accent:#3E7C78; --bg:#F5F6F8; --card:#FFFFFF;
    --line:#E4E7EB; --text:#16212C; --muted:#66727D; --ok:#3F7D5C; --warn:#B2503B; --blue:#3D6E93;
    --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
    --shadow-sm:0 1px 2px rgba(11,35,64,.05);
    --shadow-md:0 1px 2px rgba(11,35,64,.04), 0 10px 24px -8px rgba(11,35,64,.12);
    --shadow-lg:0 20px 48px -12px rgba(11,35,64,.22);
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:"Inter",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.brand-word{font-family:"Manrope","Inter",sans-serif;}
  ::selection{background:var(--accent);color:#fff;}
  /* Visible keyboard focus everywhere, incl. on the JS-generated buttons/inputs */
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;
  }

  /* ---------- Header & brand ---------- */
  header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;position:relative;overflow:hidden;}
  /* Faint wave-ply watermark echoing the logo, purely decorative */
  header:before{content:"";position:absolute;right:-40px;top:-60px;width:260px;height:260px;
    background:radial-gradient(circle,rgba(62,124,120,.25),transparent 70%);pointer-events:none;}
  header .left{display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:relative;z-index:1;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand-mark{height:32px;width:auto;flex-shrink:0;}
  .brand-word{font-size:15.5px;font-weight:800;letter-spacing:.4px;line-height:1.1;}
  .brand-word small{display:block;font-family:"Inter",sans-serif;font-size:10.5px;font-weight:500;color:#AEC0CC;letter-spacing:.5px;text-transform:uppercase;margin-top:2px;}
  header h1{font-size:15.5px;margin:0;font-weight:800;letter-spacing:.4px;}
  header .sub{font-size:11px;color:#9FB2C0;font-weight:400;margin-top:1px;}
  .icon-btn{display:none;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;width:38px;height:38px;border-radius:var(--radius-sm);align-items:center;justify-content:center;cursor:pointer;transition:background .2s var(--ease);}
  .icon-btn:hover{background:rgba(255,255,255,.14);}
  .module-switch{display:flex;background:rgba(255,255,255,.08);border-radius:10px;padding:3px;gap:2px;position:relative;z-index:1;}
  .module-btn{border:none;background:none;color:#C3D2DC;padding:8px 16px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s var(--ease),color .2s var(--ease);}
  .module-btn:hover{color:#fff;}
  .module-btn.active{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm);}
  .subbar{background:var(--navy-dark);padding:9px 24px;display:flex;gap:6px;overflow-x:auto;}
  .subtab{border:none;background:none;color:#93A6B4;padding:7px 15px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .2s var(--ease),color .2s var(--ease);}
  .subtab:hover{color:#fff;}
  .subtab.active{background:rgba(255,255,255,.12);color:#fff;}

  /* ---------- Buttons ---------- */
  .btn{border:none;border-radius:var(--radius-sm);padding:10px 18px;font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:transform .15s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease),filter .2s var(--ease);}
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn-accent{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm);}
  .btn-accent:hover{filter:brightness(1.08);box-shadow:var(--shadow-md);}
  .btn-outline{background:#fff;color:var(--navy);border:1px solid var(--line);}
  .btn-outline:hover{background:#F3F5F6;border-color:#D3D9DE;}
  .btn-small{padding:6px 12px;font-size:12px;border-radius:7px;}

  /* ---------- Layout ---------- */
  .layout{display:flex;flex:1;min-height:0;}
  .sidebar{width:300px;min-width:260px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:transform .28s var(--ease);}
  .sidebar .search{padding:14px;border-bottom:1px solid var(--line);}
  .sidebar input[type=text]{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;transition:border-color .2s var(--ease),box-shadow .2s var(--ease);}
  .sidebar input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(62,124,120,.14);outline:none;}
  .list{overflow-y:auto;flex:1;}
  .item{padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent;transition:background .15s var(--ease),border-color .15s var(--ease);}
  .item:hover{background:#F6F8F9;}
  .item.active{background:#EEF3F3;border-left:3px solid var(--accent);}
  .item .name{font-weight:700;font-size:13.5px;color:var(--navy);}
  .item .meta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .empty-list{padding:26px 16px;font-size:12.5px;color:var(--muted);text-align:center;}
  .main{flex:1;overflow-y:auto;padding:24px;}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);text-align:center;gap:10px;}
  .empty-state h2{color:var(--navy);font-size:18px;margin:0;font-weight:800;}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(11,35,64,.4);z-index:19;opacity:0;transition:opacity .25s var(--ease);}

  /* ---------- Tabs & cards ---------- */
  .tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--line);}
  .tab{padding:10px 16px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:color .2s var(--ease),border-color .2s var(--ease);}
  .tab:hover{color:var(--navy);}
  .tab.active{color:var(--navy);border-bottom-color:var(--accent);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow-sm);transition:box-shadow .2s var(--ease);}
  .card h3{margin:0 0 16px 0;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--navy);padding:0 0 10px 0;border-bottom:1px solid var(--line);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;}
  .grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px 16px;}
  .field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;}
  .field .hint{font-size:11px;color:var(--muted);font-weight:400;text-transform:none;margin-top:4px;}
  .field input[type=text],.field input[type=date],.field input[type=tel],.field input[type=email],.field select,.field textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:13.5px;font-family:inherit;background:#fff;transition:border-color .2s var(--ease),box-shadow .2s var(--ease);
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(62,124,120,.14);outline:none;}
  .field textarea{resize:vertical;min-height:60px;}
  .row-list{display:flex;flex-direction:column;gap:8px;}
  .row-item{display:flex;gap:8px;align-items:center;}
  .row-item input{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:13.5px;font-family:inherit;transition:border-color .2s var(--ease);}
  .row-item select{padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:13.5px;font-family:inherit;background:#fff;transition:border-color .2s var(--ease);}
  .row-item select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(62,124,120,.14);}
  .row-item input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(62,124,120,.14);}
  .row-item .rm{background:none;border:none;color:var(--warn);cursor:pointer;font-size:16px;padding:4px 8px;border-radius:6px;transition:background .15s var(--ease);}
  .row-item .rm:hover{background:#FBEAE8;}
  .add-row{margin-top:6px;background:none;border:1px dashed var(--line);border-radius:var(--radius-sm);padding:8px 14px;font-size:12.5px;font-family:inherit;color:var(--navy);cursor:pointer;text-align:left;transition:background .15s var(--ease),border-color .15s var(--ease);}
  .add-row:hover{background:#F6F8F9;border-color:var(--accent);}
  .photo-box{border:2px dashed var(--line);border-radius:var(--radius-sm);padding:16px;text-align:center;color:var(--muted);font-size:12.5px;}
  .actions-bar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:16px;}
  .fiche-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--navy);padding-bottom:12px;margin-bottom:20px;}
  .fiche-header .brand{font-weight:800;color:var(--navy);font-size:14px;letter-spacing:.3px;}
  .fiche-header .ficheType{font-size:12px;color:var(--muted);}
  .fiche-title{font-size:22px;font-weight:800;color:var(--navy);margin:0 0 4px 0;}
  .kv{display:grid;grid-template-columns:220px 1fr;font-size:13.5px;padding:7px 0;border-bottom:1px solid #F0F2F4;}
  .kv .k{color:var(--muted);font-weight:600;}
  .bullet-list{list-style:none;padding:0;margin:0;}
  .bullet-list li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .bullet-list li:before{content:"– ";color:var(--accent);font-weight:700;}
  table.fiche-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px;border-radius:var(--radius-sm);overflow:hidden;}
  table.fiche-table th{background:var(--navy);color:#fff;text-align:left;padding:9px 11px;font-size:11.5px;font-weight:600;letter-spacing:.2px;}
  table.fiche-table td{padding:9px 11px;border-bottom:1px solid var(--line);}
  table.fiche-table tr:nth-child(even) td{background:#FAFBFC;}
  table.plan-table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);}
  table.plan-table th{background:var(--navy);color:#fff;text-align:left;padding:11px 13px;font-size:11.5px;font-weight:600;letter-spacing:.2px;}
  table.plan-table td{padding:11px 13px;border-bottom:1px solid var(--line);}
  table.plan-table tr:hover td{background:#F7F9FA;}
  .chk{width:18px;height:18px;cursor:pointer;accent-color:var(--accent);}
  .status-tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
  .status-ok{background:#E3F1EA;color:var(--ok);}
  .status-pending{background:#FBEAE8;color:var(--warn);}
  .status-progress{background:#E8EFF4;color:var(--blue);}
  .status-soon{background:#FBEEDC;color:#9A6A1E;}
  .type-tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:10.5px;font-weight:700;background:#E6EEED;color:var(--accent);}
  .type-tag-h{background:#E8EFF4;color:var(--blue);}
  .placeholder-italic{color:var(--muted);font-style:italic;font-size:12.5px;}
  .progress-bar{height:8px;background:#EAEDF0;border-radius:99px;overflow:hidden;margin-top:6px;}
  .progress-fill{height:100%;background:var(--accent);transition:width .3s var(--ease);}
  .section-intro{font-size:12.5px;color:var(--muted);margin-bottom:12px;}

  .dropzone{border:2px dashed var(--line);border-radius:var(--radius-sm);padding:24px 14px;text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer;transition:background .2s var(--ease),border-color .2s var(--ease);}
  .dropzone:hover{background:#F6F8F9;border-color:var(--accent);}
  .dropzone.drag{background:#EEF3F3;border-color:var(--accent);color:var(--navy);}
  .capture-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px;}
  .capture-item{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:#fff;display:flex;flex-direction:column;transition:box-shadow .2s var(--ease),transform .2s var(--ease);}
  .capture-item:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .capture-item .cap-thumb{width:100%;height:110px;object-fit:cover;display:block;cursor:zoom-in;background:#EEF1F3;}
  .capture-item .cap-date{font-size:10.5px;color:var(--muted);padding:6px 8px 0;}
  .capture-item .cap-caption-view{font-size:12px;padding:2px 8px 8px;color:var(--text);}
  .capture-item input[type=text]{width:100%;border:none;border-top:1px solid var(--line);padding:6px 8px;font-size:11.5px;font-family:inherit;}
  .capture-item .cap-rm{width:100%;border:none;border-top:1px solid var(--line);background:#FBEAE8;color:var(--warn);font-size:11px;padding:6px;cursor:pointer;font-weight:600;font-family:inherit;transition:background .15s var(--ease);}
  .capture-item .cap-rm:hover{background:#F6D9D5;}
  .lightbox{position:fixed;inset:0;background:rgba(7,26,48,.88);display:none;align-items:center;justify-content:center;z-index:999;padding:34px;cursor:zoom-out;backdrop-filter:blur(2px);}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:92%;max-height:92%;border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);}

  .doc-list{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .doc-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;background:#fff;flex-wrap:wrap;transition:box-shadow .2s var(--ease);}
  .doc-item:hover{box-shadow:var(--shadow-sm);}
  .doc-item .doc-icon{width:38px;height:38px;border-radius:8px;background:#EEF3F3;color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;}
  .doc-item .doc-info{flex:1;min-width:140px;}
  .doc-item .doc-name{font-size:13px;font-weight:700;color:var(--navy);word-break:break-all;}
  .doc-item .doc-meta{font-size:11px;color:var(--muted);margin-top:2px;}
  .doc-item .doc-fields{display:flex;gap:8px;align-items:center;}
  .doc-item .doc-fields input[type=text],.doc-item .doc-fields input[type=number]{padding:7px 9px;font-size:12px;font-family:inherit;border:1px solid var(--line);border-radius:7px;}
  .doc-item .doc-actions{display:flex;gap:6px;}

  .material-row{display:flex;gap:8px;align-items:center;}
  .material-row input[type=text]{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);font-family:inherit;}
  .material-row select{padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:#fff;}
  .mat-ok{color:var(--ok);font-weight:700;}
  .mat-manquant{color:var(--warn);font-weight:700;}
  table.fiche-table .wf{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;font-family:inherit;transition:border-color .2s var(--ease);}
  table.fiche-table .wf:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(62,124,120,.14);}

  /* ---------- Footer ---------- */
  footer{background:var(--navy-dark);color:#8FA3B1;font-size:11px;padding:9px 24px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  footer .footer-brand{display:flex;align-items:center;gap:8px;}
  footer .footer-brand img{height:17px;width:auto;border-radius:0;}
  footer .footer-brand b{color:#C3D2DC;font-weight:700;letter-spacing:.2px;}

  /* ---------- Responsive : mobile drawer for the sidebar ---------- */
  @media (max-width:900px){
    .icon-btn{display:inline-flex;}
    header h1,.brand-word small{display:none;}
    .sidebar{position:fixed;top:0;left:0;bottom:0;width:82vw;max-width:340px;z-index:20;transform:translateX(-100%);box-shadow:var(--shadow-lg);}
    .sidebar.open{transform:translateX(0);}
    .sidebar-backdrop.open{display:block;opacity:1;}
    .grid2,.grid4{grid-template-columns:1fr;}
    .main{padding:16px;}
    header{padding:12px 16px;}
    .subbar{padding:8px 16px;}
    footer{padding:8px 16px;justify-content:center;text-align:center;}
  }

  @media print{
    header,.subbar,.sidebar,.tabs,.actions-bar,.no-print,.lightbox,footer,.sidebar-backdrop{display:none !important;}
    .layout{display:block;}
    .main{padding:0;overflow:visible;}
    body{background:#fff;}
    .card{border:none;box-shadow:none;padding:0;margin-bottom:14px;}
  }
</style>
</head>

<script>
let activeModule = 'hivernage';
let hivSubTab = 'clients';
let boats = [];
let prodJobs = [];
let staff = [];
let currentBoatId = null;
let currentProdId = null;
let currentStaffId = null;
let currentTab = 'interne';

function uid(p){ return p+'_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]; }); }
function fmtDate(d){ if(!d) return ''; const p=d.split('-'); if(p.length!==3) return d; return p[2]+'/'+p[1]+'/'+p[0]; }
function daysUntil(d){ if(!d) return null; const t=new Date(d+'T00:00:00'); const now=new Date(); now.setHours(0,0,0,0); return Math.round((t-now)/86400000); }
// Combine les demandes client + les points relevés par nos soins en une seule liste de travaux à réaliser
function combinedWork(b){
  const items = [];
  (b.requests||[]).forEach(function(r, idx){ if((r.text||'').trim()) items.push({ src:'request', idx: idx, label: r.text, done: !!r.done, dueDate: r.dueDate||'', assignedTo: r.assignedTo||'' }); });
  (b.techNotes||[]).forEach(function(n, idx){
    if(!(n.constat||'').trim() && !(n.action||'').trim()) return;
    let label = n.constat || '';
    if(n.action) label += ' — ' + n.action;
    items.push({ src:'technote', idx: idx, label: label, done: !!n.done, dueDate: n.dueDate||'', assignedTo: n.assignedTo||'' });
  });
  return items;
}

function emptyBoat(){
  return {
    id: uid('b'), ficheNumber:'', createdAt: new Date().toISOString().slice(0,10),
    clientName:'', clientNumber:'', clientPhone:'', clientEmail:'',
    boatType:'', boatNumber:'', boatName:'',
    hivernageDate:'', pickupLocation:'', buoyNumber:'', photo:'',
    requests: [], inventory: [], sailRack:'', gearShelf:'', boatOnRacks:false,
    techNotes: [],
    emailCaptures: [], internalNotes: '',
    hangarOutDate:'', launchDatePlanned:'', launchLocation:'', launchDateActual:'', transmittedDate:'', transmittedTo:'', responsable:'',
    handoverNeeded:false, infoText:'',
    inventoryNotes:'', pointsNotes:''
  };
}
function emptyProd(){
  return {
    id: uid('p'), dossierNumber:'', createdAt: new Date().toISOString().slice(0,10),
    type:'fabrication',
    title:'', client:'', clientPhone:'', clientEmail:'', clientAddress:'',
    reference:'', boatTypeWanted:'', color:'', options:[], optionsNotes:'', description:'',
    status:'a_faire', receptionDate:'', startDate:'', endDate:'', deliveryDate:'',
    tasks: [], notes:'', quoteFiles: [], materials: []
  };
}
function emptyStaff(){
  return { id: uid('st'), name:'', role:'', phone:'', email:'', notes:'', leaves: [] };
}
// Construit les <option> d'une liste déroulante "Qui" à partir du personnel enregistré.
// Garde la valeur actuelle même si elle ne correspond à personne (texte libre historique).
function staffOptions(selected){
  const names = staff.map(function(s){ return s.name; }).filter(function(n){ return (n||'').trim(); });
  if(selected && names.indexOf(selected)===-1) names.push(selected);
  let opts = '<option value=""'+(!selected?' selected':'')+'>—</option>';
  names.forEach(function(n){ opts += '<option value="'+esc(n)+'"'+(n===selected?' selected':'')+'>'+esc(n)+'</option>'; });
  return opts;
}
// Recense automatiquement, dans Hivernage et Prod, tout ce qui est assigné à un employé
function assignedWorkFor(name){
  const items = [];
  const n = (name||'').trim().toLowerCase();
  if(!n) return items;
  boats.forEach(function(b){
    combinedWork(b).forEach(function(x){
      if((x.assignedTo||'').trim().toLowerCase()===n){
        items.push({ module:'Hivernage', context:(b.clientName||'Client')+' — '+(b.boatName||'Bateau'), label:x.label, dueDate:x.dueDate, done:x.done });
      }
    });
  });
  prodJobs.forEach(function(p){
    (p.tasks||[]).forEach(function(t){
      if((t.assignedTo||'').trim().toLowerCase()===n && (t.task||'').trim()){
        items.push({ module:'Prod', context:p.title||'Dossier', label:t.task, dueDate:t.dueDate, done:t.done });
      }
    });
  });
  items.sort(function(a,c){ return (a.dueDate||'9999').localeCompare(c.dueDate||'9999'); });
  return items;
}

function openLightbox(src){
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lightbox').addEventListener('click', function(){ this.classList.remove('open'); });

// Redimensionne/compresse chaque image avant stockage (le localStorage est limité en taille)
function addEmailCaptures(b, files, cb){
  const list = Array.from(files||[]).filter(function(f){ return f.type && f.type.indexOf('image/')===0; });
  let remaining = list.length;
  if(!remaining){ cb&&cb(); return; }
  list.forEach(function(file){
    const reader = new FileReader();
    reader.onload = function(){
      const img = new Image();
      img.onload = function(){
        const maxW = 1100;
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        let dataUrl;
        try{ dataUrl = canvas.toDataURL('image/jpeg', 0.82); }catch(e){ dataUrl = reader.result; }
        b.emailCaptures.push({ id: uid('cap'), image: dataUrl, caption:'', addedAt: new Date().toISOString().slice(0,10) });
        remaining--;
        if(remaining===0){ saveBoats(); cb&&cb(); }
      };
      img.onerror = function(){ remaining--; if(remaining===0){ saveBoats(); cb&&cb(); } };
      img.src = reader.result;
    };
    reader.onerror = function(){ remaining--; if(remaining===0){ saveBoats(); cb&&cb(); } };
    reader.readAsDataURL(file);
  });
}

// Ajoute un ou plusieurs fichiers de devis (PDF ou image) à un dossier de prod
function addQuoteFile(p, files, cb){
  const list = Array.from(files||[]).filter(function(f){ return f.type==='application/pdf' || (f.type && f.type.indexOf('image/')===0); });
  let remaining = list.length;
  if(!remaining){ cb&&cb(); return; }
  list.forEach(function(file){
    const isImage = file.type.indexOf('image/')===0;
    const reader = new FileReader();
    reader.onload = function(){
      if(isImage){
        const img = new Image();
        img.onload = function(){
          const maxW = 1400;
          let w = img.width, h = img.height;
          if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          let dataUrl; try{ dataUrl = canvas.toDataURL('image/jpeg', 0.85); }catch(e){ dataUrl = reader.result; }
          p.quoteFiles.push({ id: uid('doc'), fileName: file.name, mimeType: 'image/jpeg', data: dataUrl, amount:'', date: new Date().toISOString().slice(0,10), note:'' });
          remaining--; if(remaining===0){ saveProd(); cb&&cb(); }
        };
        img.onerror = function(){ remaining--; if(remaining===0){ saveProd(); cb&&cb(); } };
        img.src = reader.result;
      } else {
        p.quoteFiles.push({ id: uid('doc'), fileName: file.name, mimeType: file.type, data: reader.result, amount:'', date: new Date().toISOString().slice(0,10), note:'' });
        remaining--; if(remaining===0){ saveProd(); cb&&cb(); }
      }
    };
    reader.onerror = function(){ remaining--; if(remaining===0){ saveProd(); cb&&cb(); } };
    reader.readAsDataURL(file);
  });
}

function loadAll(){
  try{ boats = JSON.parse(localStorage.getItem('mc_boats')||'[]'); }catch(e){ boats=[]; }
  try{ prodJobs = JSON.parse(localStorage.getItem('mc_prod')||'[]'); }catch(e){ prodJobs=[]; }
  try{ staff = JSON.parse(localStorage.getItem('mc_staff')||'[]'); }catch(e){ staff=[]; }
  boats.forEach(function(b){
    if(!b.emailCaptures) b.emailCaptures=[];
    if(b.internalNotes===undefined) b.internalNotes='';
    if(b.hivernageDate===undefined) b.hivernageDate = b.pickupDate || '';
    if(b.boatOnRacks===undefined) b.boatOnRacks = false;
    if(b.transmittedTo===undefined) b.transmittedTo = '';
    if(b.launchLocation===undefined) b.launchLocation = '';
    if(b.handoverNeeded===undefined) b.handoverNeeded = false;
    if(b.infoText===undefined) b.infoText = '';
    if(b.inventoryNotes===undefined) b.inventoryNotes = '';
    if(b.pointsNotes===undefined) b.pointsNotes = '';
    if(!Array.isArray(b.requests)) b.requests = [];
    b.requests = b.requests.map(function(r){ return (typeof r === 'string') ? {id:uid('req'), text:r, done:false} : r; });
    b.requests.forEach(function(r){ if(r.dueDate===undefined) r.dueDate=''; if(r.assignedTo===undefined) r.assignedTo=''; });
    if(!Array.isArray(b.techNotes)) b.techNotes = [];
    b.techNotes.forEach(function(n){ if(n.done===undefined) n.done=false; if(n.dueDate===undefined) n.dueDate=''; if(n.assignedTo===undefined) n.assignedTo=''; });
  });
  prodJobs.forEach(function(p){
    if(!p.quoteFiles) p.quoteFiles=[];
    if(!p.materials) p.materials=[];
    if(p.clientPhone===undefined) p.clientPhone='';
    if(p.clientEmail===undefined) p.clientEmail='';
    if(p.clientAddress===undefined) p.clientAddress='';
    if(p.optionsNotes===undefined) p.optionsNotes='';
    if(!Array.isArray(p.tasks)) p.tasks=[];
    p.tasks.forEach(function(t){ if(t.dueDate===undefined) t.dueDate=''; if(t.assignedTo===undefined) t.assignedTo=''; });
  });
  staff.forEach(function(s){
    if(!Array.isArray(s.leaves)) s.leaves=[];
    if(s.email===undefined) s.email='';
    if(s.notes===undefined) s.notes='';
  });
  renderAll();
}
function saveBoats(){
  try{ localStorage.setItem('mc_boats', JSON.stringify(boats)); }
  catch(e){ console.error(e); alert("Erreur d'enregistrement : le stockage local est peut-être plein. Essayez de supprimer d'anciennes captures d'écran (les images prennent beaucoup de place)."); }
}
function saveProd(){
  try{ localStorage.setItem('mc_prod', JSON.stringify(prodJobs)); }
  catch(e){ console.error(e); alert("Erreur d'enregistrement : le stockage local est peut-être plein. Essayez de supprimer d'anciens fichiers de devis (les fichiers volumineux prennent beaucoup de place)."); }
}
function saveStaff(){
  try{ localStorage.setItem('mc_staff', JSON.stringify(staff)); }
  catch(e){ console.error(e); alert("Erreur d'enregistrement : le stockage local est peut-être plein."); }
}

document.querySelectorAll('.module-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    activeModule = btn.dataset.module;
    hivSubTab = 'clients';
    document.getElementById('searchInput').value = '';
    syncHeaderUI();
    renderAll();
  });
});

function syncHeaderUI(){
  document.querySelectorAll('.module-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.module===activeModule); });
  const subbar = document.getElementById('subbar');
  if(activeModule==='hivernage'){
    subbar.style.display='flex';
    subbar.innerHTML =
      '<button class="subtab '+(hivSubTab==='clients'?'active':'')+'" data-sub="clients">Clients</button>'+
      '<button class="subtab '+(hivSubTab==='planning'?'active':'')+'" data-sub="planning">Planning hivernage</button>';
    subbar.querySelectorAll('.subtab').forEach(function(t){ t.addEventListener('click', function(){ hivSubTab=t.dataset.sub; syncHeaderUI(); renderAll(); }); });
  } else {
    subbar.style.display='none';
  }
  const showSidebar = (activeModule==='hivernage' && hivSubTab==='clients') || activeModule==='prod' || activeModule==='personnel';
  document.getElementById('sidebar').style.display = showSidebar ? 'flex' : 'none';
  document.getElementById('newItemBtn').style.display = (activeModule==='planning' || (activeModule==='hivernage'&&hivSubTab==='planning')) ? 'none' : 'inline-block';
}

document.getElementById('newItemBtn').addEventListener('click', function(){
  if(activeModule==='hivernage'){
    const nb = emptyBoat(); nb.ficheNumber = 'H-' + (boats.length+1).toString().padStart(3,'0');
    boats.push(nb); currentBoatId=nb.id; currentTab='edit'; saveBoats();
  } else if(activeModule==='prod'){
    const np = emptyProd(); np.dossierNumber = 'P-' + (prodJobs.length+1).toString().padStart(3,'0');
    prodJobs.push(np); currentProdId=np.id; currentTab='edit'; saveProd();
  } else if(activeModule==='personnel'){
    const ns = emptyStaff();
    staff.push(ns); currentStaffId=ns.id; saveStaff();
  }
  renderAll();
});

document.getElementById('searchInput').addEventListener('input', renderList);

function renderAll(){ syncHeaderUI(); renderList(); renderMain(); }

function renderList(){
  const el = document.getElementById('listArea');
  const q = (document.getElementById('searchInput').value||'').toLowerCase();
  if(activeModule==='hivernage' && hivSubTab==='clients'){
    const filtered = boats.filter(function(b){ return (b.clientName||'').toLowerCase().indexOf(q)>-1 || (b.boatName||'').toLowerCase().indexOf(q)>-1 || (b.boatNumber||'').toLowerCase().indexOf(q)>-1; })
      .sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });
    if(!filtered.length){ el.innerHTML = '<div class="empty-list">Aucun bateau enregistré. Cliquez sur "+ Nouveau" pour commencer.</div>'; return; }
    el.innerHTML = filtered.map(function(b){ return '<div class="item '+(b.id===currentBoatId?'active':'')+'" data-id="'+b.id+'">'+
      '<div class="name">'+esc(b.clientName||'Client sans nom')+'</div>'+
      '<div class="meta">'+esc(b.boatName||'Bateau sans nom')+(b.boatNumber?' · '+esc(b.boatNumber):'')+'</div>'+
      '<div class="meta">'+(b.hivernageDate?"Début hivernage : "+fmtDate(b.hivernageDate):'Date non définie')+'</div></div>'; }).join('');
    el.querySelectorAll('.item').forEach(function(it){ it.addEventListener('click', function(){ currentBoatId=it.dataset.id; currentTab='interne'; renderAll(); }); });
  } else if(activeModule==='prod'){
    const filtered = prodJobs.filter(function(p){ return (p.client||'').toLowerCase().indexOf(q)>-1 || (p.title||'').toLowerCase().indexOf(q)>-1 || (p.reference||'').toLowerCase().indexOf(q)>-1; })
      .sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });
    if(!filtered.length){ el.innerHTML = '<div class="empty-list">Aucun dossier de prod. Cliquez sur "+ Nouveau" pour commencer.</div>'; return; }
    el.innerHTML = filtered.map(function(p){ return '<div class="item '+(p.id===currentProdId?'active':'')+'" data-id="'+p.id+'">'+
      '<div class="name">'+esc(p.title||'Dossier sans nom')+'</div>'+
      '<div class="meta"><span class="type-tag">'+(p.type==='chantier'?'Chantier':'Fabrication')+'</span> '+statusBadge(p.status)+'</div>'+
      '<div class="meta">'+esc(p.client||'Client non renseigné')+'</div></div>'; }).join('');
    el.querySelectorAll('.item').forEach(function(it){ it.addEventListener('click', function(){ currentProdId=it.dataset.id; currentTab='detail'; renderAll(); }); });
  } else if(activeModule==='personnel'){
    const filtered = staff.filter(function(s){ return (s.name||'').toLowerCase().indexOf(q)>-1 || (s.role||'').toLowerCase().indexOf(q)>-1; })
      .sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
    if(!filtered.length){ el.innerHTML = '<div class="empty-list">Aucun employé enregistré. Cliquez sur "+ Nouveau" pour commencer.</div>'; return; }
    el.innerHTML = filtered.map(function(s){ return '<div class="item '+(s.id===currentStaffId?'active':'')+'" data-id="'+s.id+'">'+
      '<div class="name">'+esc(s.name||'Sans nom')+'</div>'+
      '<div class="meta">'+esc(s.role||'Poste non renseigné')+(s.phone?' · '+esc(s.phone):'')+'</div></div>'; }).join('');
    el.querySelectorAll('.item').forEach(function(it){ it.addEventListener('click', function(){ currentStaffId=it.dataset.id; renderAll(); }); });
  }
}

function statusBadge(status){
  const map = { a_faire:['status-pending','À faire'], en_cours:['status-progress','En cours'], fini:['status-ok','Terminé'] };
  const m = map[status] || map.a_faire;
  return '<span class="status-tag '+m[0]+'">'+m[1]+'</span>';
}

function renderMain(){
  if(activeModule==='hivernage'){
    if(hivSubTab==='clients') renderBoatMain(); else renderHivPlanning();
  } else if(activeModule==='prod'){
    renderProdMain();
  } else if(activeModule==='personnel'){
    renderStaffMain();
  } else {
    renderGlobalPlanning();
  }
}

function renderHivPlanning(){
  const main = document.getElementById('main');
  const rows = boats.map(function(b){
    const nextDate = [b.hangarOutDate, b.launchDatePlanned, b.hivernageDate].filter(Boolean).sort()[0] || '';
    return {b:b, nextDate:nextDate};
  }).filter(function(r){ return r.b.hivernageDate||r.b.hangarOutDate||r.b.launchDatePlanned; })
    .sort(function(a,c){ return (a.nextDate||'9999').localeCompare(c.nextDate||'9999'); });

  const others = boats.filter(function(b){ return !b.hivernageDate && !b.hangarOutDate && !b.launchDatePlanned; });

  function rowStatus(b){
    let d = daysUntil(b.hangarOutDate);
    if(d===null) d = daysUntil(b.launchDatePlanned);
    if(d===null) return '';
    if(d<0) return '<span class="status-tag status-pending">En retard</span>';
    if(d<=7) return '<span class="status-tag status-soon">Dans '+d+' j</span>';
    return '';
  }

  main.innerHTML =
    '<div class="card">'+
      '<h3>Planning hivernage — tous les bateaux</h3>'+
      '<div class="section-intro">Trié par prochaine échéance (sortie hangar / mise à l\'eau / hivernage)</div>'+
      '<table class="plan-table">'+
        "<tr><th>Client</th><th>Bateau</th><th>Date d'hivernage</th><th>Sortie hangar (préparation)</th><th>Mise à l'eau prévue</th><th></th></tr>"+
        (rows.length ? rows.map(function(r){ return '<tr>'+
            '<td>'+(esc(r.b.clientName)||'—')+'</td>'+
            '<td>'+(esc(r.b.boatName)||'—')+'</td>'+
            '<td>'+(fmtDate(r.b.hivernageDate)||'—')+'</td>'+
            '<td>'+(fmtDate(r.b.hangarOutDate)||'—')+' '+rowStatus(r.b)+'</td>'+
            '<td>'+(fmtDate(r.b.launchDatePlanned)||'—')+'</td>'+
            '<td><button class="btn btn-outline btn-small" data-open="'+r.b.id+'">Ouvrir</button></td>'+
          '</tr>'; }).join('') : '<tr><td colspan="6" class="placeholder-italic">Aucune date renseignée pour le moment</td></tr>')+
      '</table>'+
      (others.length ? '<div class="section-intro" style="margin-top:14px;">'+others.length+' bateau(x) sans date renseignée : '+others.map(function(o){return esc(o.clientName||'?');}).join(', ')+'</div>' : '')+
    '</div>';
  main.querySelectorAll('[data-open]').forEach(function(btn){ btn.addEventListener('click', function(){
    currentBoatId = btn.dataset.open; hivSubTab='clients'; currentTab='interne'; syncHeaderUI(); renderAll();
  }); });
}

function renderGantt(p){
  const stages = [
    {k:'startDate', lbl:'Début construction', color:'#2C6FA8'},
    {k:'endDate', lbl:'Fin construction', color:'#C97A3B'},
    {k:'deliveryDate', lbl:'Livraison', color:'#2E7D5B'}
  ];
  const defined = stages.filter(function(s){ return !!p[s.k]; });
  if(defined.length<2) return '<div class="placeholder-italic">Renseignez au moins 2 dates (dans "Modifier") pour afficher le mini-planning</div>';
  const times = defined.map(function(s){ return new Date(p[s.k]).getTime(); });
  const min=Math.min.apply(null,times), max=Math.max.apply(null,times), span=Math.max(max-min,1);
  const markers = defined.map(function(s){
    const pct = ((new Date(p[s.k]).getTime()-min)/span*100).toFixed(1);
    return '<div style="position:absolute;left:'+pct+'%;top:0;transform:translateX(-50%);text-align:center;">'+
      '<div style="width:11px;height:11px;border-radius:50%;background:'+s.color+';margin:0 auto;border:2px solid #fff;box-shadow:0 0 0 1px '+s.color+';"></div>'+
      '<div style="font-size:10.5px;color:var(--muted);margin-top:5px;white-space:nowrap;"><b style="color:var(--navy);">'+s.lbl+'</b><br>'+fmtDate(p[s.k])+'</div>'+
    '</div>';
  }).join('');
  return '<div style="position:relative;height:8px;margin:22px 40px 40px;background:#EAEDF0;border-radius:4px;">'+markers+'</div>';
}

      '<select data-f="status"><option value="a_faire" '+(p.status==='a_faire'?'selected':'')+'>À faire</option><option value="en_cours" '+(p.status==='en_cours'?'selected':'')+'>En cours</option><option value="fini" '+(p.status==='fini'?'selected':'')+'>Terminé</option></select>'+
    '</div></div>'+
    '<div class="card"><h3>Check-list des tâches</h3><div class="row-list" id="tasksList">'+
      p.tasks.map(function(t,idx){return '<div class="row-item"><input type="checkbox" data-donechk="'+idx+'" '+(t.done?'checked':'')+' style="flex:0;width:18px;"><input type="text" data-list="tasks" data-field="task" data-idx="'+idx+'" value="'+esc(t.task)+'" placeholder="Tâche" style="flex:2;"><input type="date" data-list="tasks" data-field="dueDate" data-idx="'+idx+'" value="'+(t.dueDate||'')+'" style="flex:0 0 145px;"><select data-list="tasks" data-field="assignedTo" data-idx="'+idx+'" style="flex:0 0 130px;">'+staffOptions(t.assignedTo)+'</select><button class="rm" data-rm="tasks" data-idx="'+idx+'">✕</button></div>';}).join('')+
    '</div><button class="add-row" data-add="tasks">+ Ajouter une tâche</button></div>'+
    '<div class="card"><h3>Matériaux nécessaires</h3>'+
      '<div class="section-intro">Pour vérifier d\'un coup d\'œil si tout ce qu\'il faut est disponible pour construire ce bateau</div>'+
      '<div class="row-list" id="materialsList">'+
      p.materials.map(function(m,idx){return '<div class="material-row"><input type="text" data-list="materials" data-field="name" data-idx="'+idx+'" value="'+esc(m.name)+'" placeholder="Ex : résine, tissu verre, moteur 115cv...">'+
        '<select data-mat-status="'+idx+'"><option value="manquant" '+(m.status!=='ok'?'selected':'')+'>Manquant</option><option value="ok" '+(m.status==='ok'?'selected':'')+'>OK</option></select>'+
        '<input type="text" data-list="materials" data-field="note" data-idx="'+idx+'" value="'+esc(m.note)+'" placeholder="Remarque (ex : quantité manquante)">'+
        '<button class="rm" data-rm="materials" data-idx="'+idx+'">✕</button></div>';}).join('')+
    '</div><button class="add-row" data-add="materials">+ Ajouter un matériau</button></div>'+
    '<div class="card"><h3>Devis</h3>'+
      '<div class="section-intro">Importez ici le devis fait à part (PDF ou capture d\'écran) pour le retrouver facilement plus tard</div>'+
      '<div class="dropzone" id="quoteDropzone">Cliquez ici, ou glissez-déposez un fichier (PDF ou image)</div>'+
      '<input type="file" id="quoteFileInput" accept="application/pdf,image/*" multiple style="display:none;">'+
      '<div class="doc-list" id="quoteList">'+p.quoteFiles.map(function(d,idx){ return '<div class="doc-item">'+
          '<div class="doc-icon">'+(d.mimeType==='application/pdf'?'PDF':'IMG')+'</div>'+
          '<div class="doc-info"><div class="doc-name">'+esc(d.fileName||'Devis')+'</div>'+
            '<div class="doc-fields" style="margin-top:4px;">'+
              '<input type="date" data-qf="date" data-idx="'+idx+'" value="'+(d.date||'')+'">'+
              '<input type="text" data-qf="amount" data-idx="'+idx+'" value="'+esc(d.amount)+'" placeholder="Montant €" style="width:90px;">'+
              '<input type="text" data-qf="note" data-idx="'+idx+'" value="'+esc(d.note)+'" placeholder="Remarque" style="width:160px;">'+
            '</div>'+
          '</div>'+
          '<div class="doc-actions"><button class="btn btn-outline btn-small qf-open" data-idx="'+idx+'">Ouvrir</button><button class="btn btn-outline btn-small" style="color:#B4483A;" data-qf-rm="'+idx+'">Supprimer</button></div>'+
        '</div>'; }).join('')+'</div>'+
    '</div>'+
    '<div class="card"><h3>Notes</h3><div class="field"><textarea data-f="notes" style="min-height:100px;">'+esc(p.notes)+'</textarea></div></div>';

  area.querySelectorAll('[data-f]').forEach(function(inp){ inp.addEventListener('input', function(){ p[inp.dataset.f]=inp.value; saveProd(); renderList(); }); });
  area.querySelectorAll('[data-list]').forEach(function(inp){
    const handler = function(){
      const list=inp.dataset.list, idx=+inp.dataset.idx, field=inp.dataset.field;
      if(list==='options') p.options[idx]=inp.value; else p[list][idx][field]=inp.value;
      saveProd();
    };
    inp.addEventListener('input', handler);
    inp.addEventListener('change', handler);
  });
  area.querySelectorAll('[data-donechk]').forEach(function(cb){ cb.addEventListener('change', function(e){ p.tasks[+e.target.dataset.donechk].done=e.target.checked; saveProd(); }); });
  area.querySelectorAll('[data-mat-status]').forEach(function(sel){ sel.addEventListener('change', function(){
    p.materials[+sel.dataset.matStatus].status = sel.value; saveProd(); renderProdEdit(p);
  }); });
  area.querySelectorAll('[data-add]').forEach(function(btn){ btn.addEventListener('click', function(){
    const list=btn.dataset.add;
    if(list==='options') p.options.push('');
    if(list==='tasks') p.tasks.push({task:'',done:false,dueDate:'',assignedTo:''});
    if(list==='materials') p.materials.push({name:'',status:'manquant',note:''});
    saveProd(); renderProdEdit(p);
  }); });
  area.querySelectorAll('[data-rm]').forEach(function(btn){ btn.addEventListener('click', function(){
    const list=btn.dataset.rm, idx=+btn.dataset.idx; p[list].splice(idx,1); saveProd(); renderProdEdit(p);
  }); });

  const qdz = document.getElementById('quoteDropzone');
  const qInput = document.getElementById('quoteFileInput');
  if(qdz && qInput){
    qdz.addEventListener('click', function(){ qInput.click(); });
    qInput.addEventListener('change', function(e){ addQuoteFile(p, e.target.files, function(){ renderProdEdit(p); }); });
    qdz.addEventListener('dragover', function(e){ e.preventDefault(); qdz.classList.add('drag'); });
    qdz.addEventListener('dragleave', function(){ qdz.classList.remove('drag'); });
    qdz.addEventListener('drop', function(e){
      e.preventDefault(); qdz.classList.remove('drag');
      addQuoteFile(p, e.dataTransfer.files, function(){ renderProdEdit(p); });
    });
  }
  area.querySelectorAll('.qf-open').forEach(function(btn){ btn.addEventListener('click', function(){
    const d = p.quoteFiles[+btn.dataset.idx];
    if(d.mimeType && d.mimeType.indexOf('image/')===0) openLightbox(d.data); else window.open(d.data, '_blank');
  }); });
  area.querySelectorAll('[data-qf]').forEach(function(inp){ inp.addEventListener('input', function(){
    p.quoteFiles[+inp.dataset.idx][inp.dataset.qf] = inp.value; saveProd();
  }); });
  area.querySelectorAll('[data-qf-rm]').forEach(function(btn){ btn.addEventListener('click', function(){
    p.quoteFiles.splice(+btn.dataset.qfRm, 1); saveProd(); renderProdEdit(p);
  }); });
}

function getCurrentStaff(){ return staff.find(function(s){ return s.id===currentStaffId; }) || null; }

function renderStaffMain(){
  const main = document.getElementById('main');
  const s = getCurrentStaff();
  if(!s){
    main.innerHTML = '<div class="empty-state"><h2>Aucun employé sélectionné</h2><p>Choisissez un employé dans la liste, ou créez-en un nouveau.</p><button class="btn btn-accent" onclick="document.getElementById(\'newItemBtn\').click()">+ Nouvel employé</button></div>';
    return;
  }
  main.innerHTML =
    '<div class="actions-bar no-print"><button class="btn btn-outline btn-small" id="deleteStaffBtn" style="color:#B4483A;">Supprimer</button></div>'+
    '<div id="staffArea"></div>';
  document.getElementById('deleteStaffBtn').addEventListener('click', function(){
    if(confirm('Supprimer la fiche de "'+(s.name||'cet employé')+'" ?')){
      staff = staff.filter(function(x){ return x.id!==s.id; }); currentStaffId=null; saveStaff(); renderAll();
    }
  });

  const area = document.getElementById('staffArea');
  const work = assignedWorkFor(s.name);
  const doneWork = work.filter(function(x){return x.done;}).length;
  area.innerHTML =
    '<div class="card">'+
      '<div class="fiche-header"><div><div class="brand">MARINE COMPOSITE</div><div class="fiche-title">'+esc(s.name||'Employé')+'</div></div><div class="ficheType">Fiche personnel</div></div>'+
      '<h3 style="margin:0 0 14px;padding:0;border:none;">Profil</h3>'+
      '<div class="grid2">'+
        '<div class="field"><label>Nom / prénom</label><input type="text" data-sf="name" value="'+esc(s.name)+'"></div>'+
        '<div class="field"><label>Poste</label><input type="text" data-sf="role" value="'+esc(s.role)+'" placeholder="Ex : stratifieur, chef d\'atelier..."></div>'+
        '<div class="field"><label>Téléphone</label><input type="tel" data-sf="phone" value="'+esc(s.phone)+'"></div>'+
        '<div class="field"><label>Email</label><input type="email" data-sf="email" value="'+esc(s.email)+'"></div>'+
      '</div>'+
      '<div class="field" style="margin-top:12px;"><label>Notes</label><textarea data-sf="notes" style="min-height:70px;">'+esc(s.notes)+'</textarea></div>'+
    '</div>'+
    '<div class="card"><h3>Tâches assignées <span class="status-tag '+((doneWork===work.length&&work.length)?'status-ok':'status-pending')+'">'+doneWork+'/'+work.length+' faites</span></h3>'+
      '<div class="section-intro">Recensées automatiquement depuis Hivernage et Prod (champ "Qui")</div>'+
      (work.length ? '<table class="fiche-table"><tr><th style="width:100px;">Module</th><th>Contexte</th><th>Tâche</th><th style="width:120px;">Échéance</th><th style="width:70px;">Fait</th></tr>'+work.map(function(x){return '<tr><td><span class="type-tag '+(x.module==='Hivernage'?'type-tag-h':'')+'">'+x.module+'</span></td><td>'+esc(x.context)+'</td><td>'+esc(x.label)+'</td><td>'+(fmtDate(x.dueDate)||'—')+'</td><td>'+(x.done?'<span class="status-tag status-ok">✓</span>':'<span class="status-tag status-pending">—</span>')+'</td></tr>';}).join('')+'</table>' : '<div class="placeholder-italic">Aucune tâche assignée à '+esc(s.name||'cet employé')+' pour le moment</div>')+
    '</div>'+
    '<div class="card"><h3>Congés / absences</h3><div class="row-list" id="leavesList">'+
      s.leaves.map(function(lv,idx){return '<div class="row-item"><input type="date" data-leave="startDate" data-idx="'+idx+'" value="'+(lv.startDate||'')+'" style="flex:1;"><input type="date" data-leave="endDate" data-idx="'+idx+'" value="'+(lv.endDate||'')+'" style="flex:1;"><input type="text" data-leave="reason" data-idx="'+idx+'" value="'+esc(lv.reason)+'" placeholder="Motif (optionnel)" style="flex:2;"><button class="rm" data-leave-rm="'+idx+'">✕</button></div>';}).join('')+
    '</div><button class="add-row" id="addLeave">+ Ajouter une période de congé</button></div>';

  area.querySelectorAll('[data-sf]').forEach(function(inp){ inp.addEventListener('input', function(){ s[inp.dataset.sf]=inp.value; saveStaff(); renderList(); }); });
  area.querySelectorAll('[data-leave]').forEach(function(inp){ inp.addEventListener('input', function(){
    s.leaves[+inp.dataset.idx][inp.dataset.leave] = inp.value; saveStaff();
  }); });
  area.querySelectorAll('[data-leave-rm]').forEach(function(btn){ btn.addEventListener('click', function(){
    s.leaves.splice(+btn.dataset.leaveRm, 1); saveStaff(); renderStaffMain();
  }); });
  document.getElementById('addLeave').addEventListener('click', function(){
    s.leaves.push({id:uid('lv'), startDate:'', endDate:'', reason:''});
    saveStaff(); renderStaffMain();
  });
}

function renderGlobalPlanning(){
  const main = document.getElementById('main');
  let events = [];
  boats.forEach(function(b){
    if(b.hivernageDate) events.push({date:b.hivernageDate, type:"Début hivernage", module:'hivernage', id:b.id, label:(b.clientName||'Client')+' — '+(b.boatName||'Bateau'), tagClass:'type-tag-h'});
    if(b.hangarOutDate) events.push({date:b.hangarOutDate, type:'Sortie hangar', module:'hivernage', id:b.id, label:(b.clientName||'Client')+' — '+(b.boatName||'Bateau'), tagClass:'type-tag-h'});
    if(b.launchDatePlanned) events.push({date:b.launchDatePlanned, type:"Mise à l'eau", module:'hivernage', id:b.id, label:(b.clientName||'Client')+' — '+(b.boatName||'Bateau'), tagClass:'type-tag-h'});
  });
  prodJobs.forEach(function(p){
    if(p.receptionDate) events.push({date:p.receptionDate, type:'Prod — Réception', module:'prod', id:p.id, label:(p.client||'Client')+' — '+(p.title||'Dossier'), tagClass:'type-tag'});
    if(p.startDate) events.push({date:p.startDate, type:'Prod — Début', module:'prod', id:p.id, label:(p.client||'Client')+' — '+(p.title||'Dossier'), tagClass:'type-tag'});
    if(p.endDate) events.push({date:p.endDate, type:'Prod — Fin', module:'prod', id:p.id, label:(p.client||'Client')+' — '+(p.title||'Dossier'), tagClass:'type-tag'});
    if(p.deliveryDate) events.push({date:p.deliveryDate, type:'Prod — Livraison', module:'prod', id:p.id, label:(p.client||'Client')+' — '+(p.title||'Dossier'), tagClass:'type-tag'});
  });
  events.sort(function(a,c){ return a.date.localeCompare(c.date); });

  main.innerHTML =
    '<div class="card">'+
      '<h3>Planning général — toutes les échéances</h3>'+
      '<div class="section-intro">Sorties d\'eau, sorties hangar, mises à l\'eau (hivernage) et étapes de production, triées par date</div>'+
      '<table class="plan-table">'+
        '<tr><th style="width:110px;">Date</th><th style="width:170px;">Type</th><th>Concerne</th><th></th></tr>'+
        (events.length ? events.map(function(e){ return '<tr>'+
            '<td>'+fmtDate(e.date)+'</td>'+
            '<td><span class="type-tag '+e.tagClass+'">'+e.type+'</span></td>'+
            '<td>'+esc(e.label)+'</td>'+
            '<td><button class="btn btn-outline btn-small" data-open-mod="'+e.module+'" data-open-id="'+e.id+'">Ouvrir</button></td>'+
          '</tr>'; }).join('') : '<tr><td colspan="4" class="placeholder-italic">Aucune date renseignée pour le moment</td></tr>')+
      '</table>'+
    '</div>';
  main.querySelectorAll('[data-open-mod]').forEach(function(btn){ btn.addEventListener('click', function(){
    const mod = btn.dataset.openMod, id = btn.dataset.openId;
    if(mod==='hivernage'){ activeModule='hivernage'; hivSubTab='clients'; currentBoatId=id; currentTab='interne'; }
    else { activeModule='prod'; currentProdId=id; currentTab='detail'; }
    syncHeaderUI(); renderAll();
  }); });
}

// Menu mobile : la sidebar devient un tiroir (drawer) sous 900px, sans toucher
// à la logique de sélection existante — on se contente d'ouvrir/fermer et de
// refermer automatiquement dès qu'un élément de la liste est choisi.
(function(){
  const sidebarEl = document.getElementById('sidebar');
  const backdropEl = document.getElementById('sidebarBackdrop');
  const toggleBtn = document.getElementById('sidebarToggle');
  function closeDrawer(){ sidebarEl.classList.remove('open'); backdropEl.classList.remove('open'); toggleBtn.setAttribute('aria-expanded','false'); }
  function openDrawer(){ sidebarEl.classList.add('open'); backdropEl.classList.add('open'); toggleBtn.setAttribute('aria-expanded','true'); }
  if(toggleBtn) toggleBtn.addEventListener('click', function(){ sidebarEl.classList.contains('open') ? closeDrawer() : openDrawer(); });
  if(backdropEl) backdropEl.addEventListener('click', closeDrawer);
  const listEl = document.getElementById('listArea');
  if(listEl) listEl.addEventListener('click', function(){ if(window.innerWidth<=900) closeDrawer(); });
})();

loadAll();
