<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marine Compo — Plateforme</title>
<style>
  :root{
    --navy:#16324F; --navy-dark:#0E2338; --accent:#C97A3B; --bg:#F3F5F7; --card:#FFFFFF;
    --line:#E1E5EA; --text:#1E2A35; --muted:#6B7A88; --ok:#2E7D5B; --warn:#B4483A; --blue:#2C6FA8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;}
  header{background:var(--navy);color:#fff;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  header .left{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px;}
  header .sub{font-size:11.5px;color:#B9C6D3;font-weight:400;margin-top:2px;}
  .module-switch{display:flex;background:rgba(255,255,255,.1);border-radius:8px;padding:3px;gap:2px;}
  .module-btn{border:none;background:none;color:#CBD8E4;padding:7px 16px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;}
  .module-btn.active{background:var(--accent);color:#fff;}
  .subbar{background:#0E2338;padding:8px 22px;display:flex;gap:6px;}
  .subtab{border:none;background:none;color:#9FB0C0;padding:6px 14px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .subtab.active{background:rgba(255,255,255,.14);color:#fff;}
  .btn{border:none;border-radius:6px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:filter .15s ease;}
  .btn:hover{filter:brightness(1.08);}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-outline{background:#fff;color:var(--navy);border:1px solid var(--line);}
  .btn-outline:hover{background:#F0F3F6;}
  .btn-small{padding:5px 10px;font-size:12px;border-radius:5px;}
  .layout{display:flex;flex:1;min-height:0;}
  .sidebar{width:300px;min-width:260px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;}
  .sidebar .search{padding:12px;border-bottom:1px solid var(--line);}
  .sidebar input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;}
  .list{overflow-y:auto;flex:1;}
  .item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
  .item:hover{background:#F5F7F9;}
  .item.active{background:#EAF0F5;border-left:3px solid var(--accent);}
  .item .name{font-weight:700;font-size:13.5px;color:var(--navy);}
  .item .meta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .empty-list{padding:24px 16px;font-size:12.5px;color:var(--muted);text-align:center;}
  .main{flex:1;overflow-y:auto;padding:22px;}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);text-align:center;gap:10px;}
  .empty-state h2{color:var(--navy);font-size:18px;margin:0;}
  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .tab{padding:9px 16px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--navy);border-bottom-color:var(--accent);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px 22px;margin-bottom:16px;}
  .card h3{margin:0 0 14px 0;font-size:13.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--navy);background:#EAF0F5;padding:8px 10px;border-radius:5px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
  .grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px 14px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;}
  .field .hint{font-size:11px;color:var(--muted);font-weight:400;text-transform:none;margin-top:3px;}
  .field input[type=text],.field input[type=date],.field input[type=tel],.field input[type=email],.field select,.field textarea{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;font-family:inherit;background:#fff;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .row-list{display:flex;flex-direction:column;gap:8px;}
  .row-item{display:flex;gap:8px;align-items:center;}
  .row-item input{flex:1;}
  .row-item .rm{background:none;border:none;color:var(--warn);cursor:pointer;font-size:16px;padding:2px 6px;}
  .add-row{margin-top:6px;background:none;border:1px dashed var(--line);border-radius:6px;padding:7px 12px;font-size:12.5px;color:var(--navy);cursor:pointer;text-align:left;}
  .add-row:hover{background:#F5F7F9;}
  .photo-box{border:2px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted);font-size:12.5px;}
  .actions-bar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px;}
  .fiche-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:18px;}
  .fiche-header .brand{font-weight:800;color:var(--navy);font-size:15px;}
  .fiche-header .ficheType{font-size:12px;color:var(--muted);}
  .fiche-title{font-size:22px;font-weight:800;color:var(--navy);margin:0 0 4px 0;}
  .kv{display:grid;grid-template-columns:220px 1fr;font-size:13.5px;padding:6px 0;border-bottom:1px solid #F0F2F4;}
  .kv .k{color:var(--muted);font-weight:600;}
  .bullet-list{list-style:none;padding:0;margin:0;}
  .bullet-list li{padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .bullet-list li:before{content:"– ";color:var(--accent);font-weight:700;}
  table.fiche-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px;}
  table.fiche-table th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;font-size:12px;}
  table.fiche-table td{padding:8px 10px;border-bottom:1px solid var(--line);}
  table.fiche-table tr:nth-child(even) td{background:#FAFBFC;}
  table.plan-table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  table.plan-table th{background:var(--navy);color:#fff;text-align:left;padding:10px 12px;font-size:12px;}
  table.plan-table td{padding:10px 12px;border-bottom:1px solid var(--line);}
  table.plan-table tr:hover td{background:#F7F9FA;}
  .chk{width:18px;height:18px;cursor:pointer;}
  .status-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap;}
  .status-ok{background:#E4F3EC;color:var(--ok);}
  .status-pending{background:#FBEAE8;color:var(--warn);}
  .status-progress{background:#E7F0F8;color:var(--blue);}
  .status-soon{background:#FDF1DF;color:#9A6A1E;}
  .type-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:700;background:#F0EAE3;color:var(--accent);}
  .type-tag-h{background:#E7F0F8;color:var(--blue);}
  .placeholder-italic{color:var(--muted);font-style:italic;font-size:12.5px;}
  .progress-bar{height:8px;background:#EAEDF0;border-radius:4px;overflow:hidden;margin-top:6px;}
  .progress-fill{height:100%;background:var(--accent);}
  .section-intro{font-size:12.5px;color:var(--muted);margin-bottom:12px;}

  @media print{
    header,.subbar,.sidebar,.tabs,.actions-bar,.no-print{display:none !important;}
    .layout{display:block;}
    .main{padding:0;overflow:visible;}
    body{background:#fff;}
    .card{border:none;box-shadow:none;padding:0;margin-bottom:14px;}
  }
</style>
</head>
<body>

<header>
  <div class="left">
    <div><h1>MARINE COMPO</h1><div class="sub">Plateforme de suivi</div></div>
    <div class="module-switch">
      <button class="module-btn active" data-module="hivernage">Hivernage</button>
      <button class="module-btn" data-module="prod">Prod</button>
      <button class="module-btn" data-module="planning">Planning général</button>
    </div>
  </div>
  <button class="btn btn-accent" id="newItemBtn">+ Nouveau</button>
</header>
<div class="subbar" id="subbar" style="display:none;"></div>

<div class="layout">
  <div class="sidebar" id="sidebar">
    <div class="search"><input type="text" id="searchInput" placeholder="Rechercher..."></div>
    <div class="list" id="listArea"></div>
  </div>
  <div class="main" id="main"></div>
</div>

<script>
let activeModule = 'hivernage';
let hivSubTab = 'clients';
let boats = [];
let prodJobs = [];
let currentBoatId = null;
let currentProdId = null;
let currentTab = 'interne';

function uid(p){ return p+'_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]; }); }
function fmtDate(d){ if(!d) return ''; const p=d.split('-'); if(p.length!==3) return d; return p[2]+'/'+p[1]+'/'+p[0]; }
function daysUntil(d){ if(!d) return null; const t=new Date(d+'T00:00:00'); const now=new Date(); now.setHours(0,0,0,0); return Math.round((t-now)/86400000); }

function emptyBoat(){
  return {
    id: uid('b'), ficheNumber:'', createdAt: new Date().toISOString().slice(0,10),
    clientName:'', clientNumber:'', clientPhone:'', clientEmail:'',
    boatType:'', boatNumber:'', boatName:'',
    requestDate:'', pickupDate:'', pickupLocation:'', buoyNumber:'', photo:'',
    requests: [], inventory: [], sailRack:'', gearShelf:'',
    tasks: [], techNotes: [],
    hangarOutDate:'', launchDatePlanned:'', launchDateActual:'', transmittedDate:'', responsable:''
  };
}
function emptyProd(){
  return {
    id: uid('p'), dossierNumber:'', createdAt: new Date().toISOString().slice(0,10),
    type:'fabrication',
    title:'', client:'', reference:'', boatTypeWanted:'', color:'', options:[], description:'',
    status:'a_faire', receptionDate:'', startDate:'', endDate:'', deliveryDate:'',
    tasks: [], notes:''
  };
}

function loadAll(){
  try{ boats = JSON.parse(localStorage.getItem('mc_boats')||'[]'); }catch(e){ boats=[]; }
  try{ prodJobs = JSON.parse(localStorage.getItem('mc_prod')||'[]'); }catch(e){ prodJobs=[]; }
  renderAll();
}
function saveBoats(){ try{ localStorage.setItem('mc_boats', JSON.stringify(boats)); }catch(e){console.error(e);} }
function saveProd(){ try{ localStorage.setItem('mc_prod', JSON.stringify(prodJobs)); }catch(e){console.error(e);} }

document.querySelectorAll('.module-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    activeModule = btn.dataset.module;
    hivSubTab = 'clients';
    document.getElementById('searchInput').value = '';
    syncHeaderUI();
    renderAll();
  });
});

function syncHeaderUI(){
  document.querySelectorAll('.module-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.module===activeModule); });
  const subbar = document.getElementById('subbar');
  if(activeModule==='hivernage'){
    subbar.style.display='flex';
    subbar.innerHTML =
      '<button class="subtab '+(hivSubTab==='clients'?'active':'')+'" data-sub="clients">Clients</button>'+
      '<button class="subtab '+(hivSubTab==='planning'?'active':'')+'" data-sub="planning">Planning hivernage</button>';
    subbar.querySelectorAll('.subtab').forEach(function(t){ t.addEventListener('click', function(){ hivSubTab=t.dataset.sub; syncHeaderUI(); renderAll(); }); });
  } else {
    subbar.style.display='none';
  }
  const showSidebar = (activeModule==='hivernage' && hivSubTab==='clients') || activeModule==='prod';
  document.getElementById('sidebar').style.display = showSidebar ? 'flex' : 'none';
  document.getElementById('newItemBtn').style.display = (activeModule==='planning' || (activeModule==='hivernage'&&hivSubTab==='planning')) ? 'none' : 'inline-block';
}

document.getElementById('newItemBtn').addEventListener('click', function(){
  if(activeModule==='hivernage'){
    const nb = emptyBoat(); nb.ficheNumber = 'H-' + (boats.length+1).toString().padStart(3,'0');
    boats.push(nb); currentBoatId=nb.id; currentTab='edit'; saveBoats();
  } else if(activeModule==='prod'){
    const np = emptyProd(); np.dossierNumber = 'P-' + (prodJobs.length+1).toString().padStart(3,'0');
    prodJobs.push(np); currentProdId=np.id; currentTab='edit'; saveProd();
  }
  renderAll();
});

document.getElementById('searchInput').addEventListener('input', renderList);

function renderAll(){ syncHeaderUI(); renderList(); renderMain(); }

function renderList(){
  const el = document.getElementById('listArea');
  const q = (document.getElementById('searchInput').value||'').toLowerCase();
  if(activeModule==='hivernage' && hivSubTab==='clients'){
    const filtered = boats.filter(function(b){ return (b.clientName||'').toLowerCase().indexOf(q)>-1 || (b.boatName||'').toLowerCase().indexOf(q)>-1 || (b.boatNumber||'').toLowerCase().indexOf(q)>-1; })
      .sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });
    if(!filtered.length){ el.innerHTML = '<div class="empty-list">Aucun bateau enregistré. Cliquez sur "+ Nouveau" pour commencer.</div>'; return; }
    el.innerHTML = filtered.map(function(b){ return '<div class="item '+(b.id===currentBoatId?'active':'')+'" data-id="'+b.id+'">'+
      '<div class="name">'+esc(b.clientName||'Client sans nom')+'</div>'+
      '<div class="meta">'+esc(b.boatName||'Bateau sans nom')+(b.boatNumber?' · '+esc(b.boatNumber):'')+'</div>'+
      '<div class="meta">'+(b.pickupDate?"Sortie d'eau : "+fmtDate(b.pickupDate):'Date non définie')+'</div></div>'; }).join('');
    el.querySelectorAll('.item').forEach(function(it){ it.addEventListener('click', function(){ currentBoatId=it.dataset.id; currentTab='interne'; renderAll(); }); });
  } else if(activeModule==='prod'){
    const filtered = prodJobs.filter(function(p){ return (p.client||'').toLowerCase().indexOf(q)>-1 || (p.title||'').toLowerCase().indexOf(q)>-1 || (p.reference||'').toLowerCase().indexOf(q)>-1; })
      .sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });
    if(!filtered.length){ el.innerHTML = '<div class="empty-list">Aucun dossier de prod. Cliquez sur "+ Nouveau" pour commencer.</div>'; return; }
    el.innerHTML = filtered.map(function(p){ return '<div class="item '+(p.id===currentProdId?'active':'')+'" data-id="'+p.id+'">'+
      '<div class="name">'+esc(p.title||'Dossier sans nom')+'</div>'+
      '<div class="meta"><span class="type-tag">'+(p.type==='chantier'?'Chantier':'Fabrication')+'</span> '+statusBadge(p.status)+'</div>'+
      '<div class="meta">'+esc(p.client||'Client non renseigné')+'</div></div>'; }).join('');
    el.querySelectorAll('.item').forEach(function(it){ it.addEventListener('click', function(){ currentProdId=it.dataset.id; currentTab='detail'; renderAll(); }); });
  }
}

function statusBadge(status){
  const map = { a_faire:['status-pending','À faire'], en_cours:['status-progress','En cours'], fini:['status-ok','Terminé'] };
  const m = map[status] || map.a_faire;
  return '<span class="status-tag '+m[0]+'">'+m[1]+'</span>';
}

function renderMain(){
  if(activeModule==='hivernage'){
    if(hivSubTab==='clients') renderBoatMain(); else renderHivPlanning();
  } else if(activeModule==='prod'){
    renderProdMain();
  } else {
    renderGlobalPlanning();
  }
}

function getCurrentBoat(){ return boats.find(function(b){ return b.id===currentBoatId; }) || null; }

function renderBoatMain(){
  const main = document.getElementById('main');
  const b = getCurrentBoat();
  if(!b){
    main.innerHTML = '<div class="empty-state"><h2>Aucun bateau sélectionné</h2><p>Choisissez un bateau dans la liste, ou créez-en un nouveau.</p><button class="btn btn-accent" onclick="document.getElementById(\'newItemBtn\').click()">+ Nouveau bateau</button></div>';
    return;
  }
  main.innerHTML =
    '<div class="tabs no-print">'+
      '<div class="tab '+(currentTab==='interne'?'active':'')+'" data-tab="interne">Fiche interne</div>'+
      '<div class="tab '+(currentTab==='terrain'?'active':'')+'" data-tab="terrain">Fiche terrain</div>'+
      '<div class="tab '+(currentTab==='edit'?'active':'')+'" data-tab="edit">Modifier / Saisie</div>'+
    '</div>'+
    '<div class="actions-bar no-print">'+
      (currentTab!=='edit' ? '<button class="btn btn-outline btn-small" id="printBtn">Imprimer cette fiche</button>' : '')+
      '<button class="btn btn-outline btn-small" id="deleteBtn" style="color:#B4483A;">Supprimer</button>'+
    '</div>'+
    '<div id="ficheArea"></div>';
  main.querySelectorAll('.tab').forEach(function(t){ t.addEventListener('click', function(){ currentTab=t.dataset.tab; renderBoatMain(); }); });
  const pb = document.getElementById('printBtn'); if(pb) pb.addEventListener('click', function(){ window.print(); });
  document.getElementById('deleteBtn').addEventListener('click', function(){
    if(confirm('Supprimer la fiche de "'+(b.clientName||'ce bateau')+'" ?')){
      boats = boats.filter(function(x){ return x.id!==b.id; }); currentBoatId=null; saveBoats(); renderAll();
    }
  });
  if(currentTab==='interne') renderBoatInterne(b);
  else if(currentTab==='terrain') renderBoatTerrain(b);
  else renderBoatEdit(b);
}

function renderBoatInterne(b){
  const area = document.getElementById('ficheArea');
  area.innerHTML =
    '<div class="card">'+
      '<div class="fiche-header"><div><div class="brand">MARINE COMPO</div><div class="fiche-title">Fiche interne — '+esc(b.clientName||'Client')+'</div></div><div class="ficheType">Usage interne · créée le '+fmtDate(b.createdAt)+'</div></div>'+
      '<h3>Client</h3>'+
      '<div class="kv"><div class="k">Nom du client</div><div>'+(esc(b.clientName)||'—')+'</div></div>'+
      '<div class="kv"><div class="k">N° client</div><div>'+(esc(b.clientNumber)||'—')+'</div></div>'+
      '<div class="kv"><div class="k">Téléphone</div><div>'+(esc(b.clientPhone)||'—')+'</div></div>'+
      '<div class="kv"><div class="k">Email</div><div>'+(esc(b.clientEmail)||'—')+'</div></div>'+
      '<h3 style="margin-top:18px;">Bateau</h3>'+
      '<div class="kv"><div class="k">Type de bateau</div><div>'+(esc(b.boatType)||'—')+'</div></div>'+
      '<div class="kv"><div class="k">N° du bateau</div><div>'+(esc(b.boatNumber)||'—')+'</div></div>'+
      '<div class="kv"><div class="k">Nom du bateau</div><div>'+(esc(b.boatName)||'—')+'</div></div>'+
      '<h3 style="margin-top:18px;">Sortie du bateau</h3>'+
      '<div class="kv"><div class="k">Date de réception demande</div><div>'+(fmtDate(b.requestDate)||'—')+'</div></div>'+
      "<div class=\"kv\"><div class=\"k\">Date de sortie d'eau souhaitée</div><div>"+(fmtDate(b.pickupDate)||'—')+'</div></div>'+
      '<div class="kv"><div class="k">Lieu de récupération</div><div>'+(esc(b.pickupLocation)||'—')+'</div></div>'+
      '<div class="kv"><div class="k">N° de boule / emplacement</div><div>'+(esc(b.buoyNumber)||'—')+'</div></div>'+
      '<div style="margin-top:12px;">'+(b.photo?'<img src="'+b.photo+'" style="max-width:320px;border-radius:8px;border:1px solid #E1E5EA;">':'<div class="photo-box">Aucune photo du lieu ajoutée</div>')+'</div>'+
    '</div>'+
    '<div class="card"><h3>Emplacements</h3>'+
      '<div class="kv"><div class="k">Rack voiles</div><div>'+(esc(b.sailRack)||'—')+'</div></div>'+
      '<div class="kv"><div class="k">Étagère affaires du bateau</div><div>'+(esc(b.gearShelf)||'—')+'</div></div>'+
    '</div>'+
    '<div class="card"><h3>Demandes du client</h3>'+
      (b.requests.length?'<ul class="bullet-list">'+b.requests.map(function(r){return '<li>'+esc(r)+'</li>';}).join('')+'</ul>':'<div class="placeholder-italic">Aucune demande enregistrée</div>')+
    '</div>'+
    '<div class="card"><h3>Travaux à réaliser</h3>'+
      (b.tasks.length?'<table class="fiche-table"><tr><th>Tâche</th><th style="width:140px;">Date prévue</th></tr>'+b.tasks.map(function(t){return '<tr><td>'+esc(t.task)+'</td><td>'+(fmtDate(t.dueDate)||'—')+'</td></tr>';}).join('')+'</table>':'<div class="placeholder-italic">Aucune tâche enregistrée</div>')+
    '</div>'+
    '<div class="card"><h3>Inventaire du bateau</h3>'+
      '<div class="section-intro">Noté à l\'arrivée pour tout retrouver au moment de la mise à l\'eau</div>'+
      (b.inventory.length?'<table class="fiche-table"><tr><th>Désignation</th><th>Emplacement / remarque</th></tr>'+b.inventory.map(function(i){return '<tr><td>'+esc(i.name)+'</td><td>'+esc(i.location)+'</td></tr>';}).join('')+'</table>':'<div class="placeholder-italic">Aucun objet enregistré</div>')+
    '</div>'+
    '<div class="card"><h3>Points relevés par nos soins</h3>'+
      (b.techNotes.length?'<table class="fiche-table"><tr><th>Constat</th><th>Action réalisée</th><th style="width:110px;">Date</th></tr>'+b.techNotes.map(function(n){return '<tr><td>'+esc(n.constat)+'</td><td>'+esc(n.action)+'</td><td>'+(fmtDate(n.date)||'—')+'</td></tr>';}).join('')+'</table>':'<div class="placeholder-italic">Aucun point relevé</div>')+
    '</div>'+
    '<div class="card"><h3>Planning</h3>'+
      "<div class=\"kv\"><div class=\"k\">Date de sortie d'eau</div><div>"+(fmtDate(b.pickupDate)||'—')+'</div></div>'+

function renderHivPlanning(){
  const main = document.getElementById('main');
  const rows = boats.map(function(b){
    const nextDate = [b.hangarOutDate, b.launchDatePlanned, b.pickupDate].filter(Boolean).sort()[0] || '';
    return {b:b, nextDate:nextDate};
  }).filter(function(r){ return r.b.pickupDate||r.b.hangarOutDate||r.b.launchDatePlanned; })
    .sort(function(a,c){ return (a.nextDate||'9999').localeCompare(c.nextDate||'9999'); });

  const others = boats.filter(function(b){ return !b.pickupDate && !b.hangarOutDate && !b.launchDatePlanned; });

  function rowStatus(b){
    let d = daysUntil(b.hangarOutDate);
    if(d===null) d = daysUntil(b.launchDatePlanned);
    if(d===null) return '';
    if(d<0) return '<span class="status-tag status-pending">En retard</span>';
    if(d<=7) return '<span class="status-tag status-soon">Dans '+d+' j</span>';
    return '';
  }

  main.innerHTML =
    '<div class="card">'+
      '<h3>Planning hivernage — tous les bateaux</h3>'+
      '<div class="section-intro">Trié par prochaine échéance (sortie hangar / mise à l\'eau / sortie d\'eau)</div>'+

        (rows.length ? rows.map(function(r){ return '<tr>'+
            '<td>'+(esc(r.b.clientName)||'—')+'</td>'+
            '<td>'+(esc(r.b.boatName)||'—')+'</td>'+

function renderGantt(p){
  const stages = [
    {k:'receptionDate', lbl:'Réception', color:'#B9C6D3'},
    {k:'startDate', lbl:'Début', color:'#2C6FA8'},
    {k:'endDate', lbl:'Fin', color:'#C97A3B'},
    {k:'deliveryDate', lbl:'Livraison', color:'#2E7D5B'}
  ];
  const defined = stages.filter(function(s){ return !!p[s.k]; });
  if(defined.length<2) return '<div class="placeholder-italic">Renseignez au moins 2 dates (dans "Modifier") pour afficher le mini-planning</div>';
  const times = defined.map(function(s){ return new Date(p[s.k]).getTime(); });
  const min=Math.min.apply(null,times), max=Math.max.apply(null,times), span=Math.max(max-min,1);
  const markers = defined.map(function(s){
    const pct = ((new Date(p[s.k]).getTime()-min)/span*100).toFixed(1);
    return '<div style="position:absolute;left:'+pct+'%;top:0;transform:translateX(-50%);text-align:center;">'+
      '<div style="width:11px;height:11px;border-radius:50%;background:'+s.color+';margin:0 auto;border:2px solid #fff;box-shadow:0 0 0 1px '+s.color+';"></div>'+
      '<div style="font-size:10.5px;color:var(--muted);margin-top:5px;white-space:nowrap;"><b style="color:var(--navy);">'+s.lbl+'</b><br>'+fmtDate(p[s.k])+'</div>'+
    '</div>';
  }).join('');
  return '<div style="position:relative;height:8px;margin:22px 40px 40px;background:#EAEDF0;border-radius:4px;">'+markers+'</div>';
}

    '<div class="card"><h3>Identification</h3><div class="grid2">'+
      '<div class="field"><label>Type de dossier</label>'+
        '<select data-f="type"><option value="fabrication" '+(p.type==='fabrication'?'selected':'')+'>Fabrication (bateau / pièce neuve)</option><option value="chantier" '+(p.type==='chantier'?'selected':'')+'>Chantier (réparation)</option></select>'+
      '</div>'+
      '<div class="field"><label>Titre du dossier</label><input type="text" data-f="title" value="'+esc(p.title)+'" placeholder="Ex : Commande M. Dupont - Day boat 6m"></div>'+
      '<div class="field"><label>Client</label><input type="text" data-f="client" value="'+esc(p.client)+'"></div>'+
      '<div class="field"><label>Modèle / référence</label><input type="text" data-f="reference" value="'+esc(p.reference)+'"></div>'+
      '<div class="field"><label>Type de bateau souhaité</label><input type="text" data-f="boatTypeWanted" value="'+esc(p.boatTypeWanted)+'" placeholder="Ex : semi-rigide 6m"></div>'+
      '<div class="field"><label>Couleur</label><input type="text" data-f="color" value="'+esc(p.color)+'"></div>'+
    '</div>'+
    '<div class="field" style="margin-top:12px;"><label>Description</label><textarea data-f="description">'+esc(p.description)+'</textarea></div>'+
    '</div>'+
    '<div class="card"><h3>Options</h3><div class="row-list" id="optionsList">'+
      p.options.map(function(o,idx){return '<div class="row-item"><input type="text" data-list="options" data-idx="'+idx+'" value="'+esc(o)+'" placeholder="Ex : moteur 115cv"><button class="rm" data-rm="options" data-idx="'+idx+'">✕</button></div>';}).join('')+
    '</div><button class="add-row" data-add="options">+ Ajouter une option</button></div>'+
    '<div class="card"><h3>Étapes / dates (mini-planning)</h3><div class="grid4">'+
      '<div class="field"><label>Réception</label><input type="date" data-f="receptionDate" value="'+p.receptionDate+'"></div>'+
      '<div class="field"><label>Début</label><input type="date" data-f="startDate" value="'+p.startDate+'"></div>'+
      '<div class="field"><label>Fin</label><input type="date" data-f="endDate" value="'+p.endDate+'"></div>'+
      '<div class="field"><label>Livraison</label><input type="date" data-f="deliveryDate" value="'+p.deliveryDate+'"></div>'+
    '</div></div>'+
    '<div class="card"><h3>Statut</h3><div class="field" style="max-width:260px;">'+
      '<select data-f="status"><option value="a_faire" '+(p.status==='a_faire'?'selected':'')+'>À faire</option><option value="en_cours" '+(p.status==='en_cours'?'selected':'')+'>En cours</option><option value="fini" '+(p.status==='fini'?'selected':'')+'>Terminé</option></select>'+
    '</div></div>'+
    '<div class="card"><h3>Checklist des tâches</h3><div class="row-list" id="tasksList">'+
      p.tasks.map(function(t,idx){return '<div class="row-item"><input type="checkbox" data-donechk="'+idx+'" '+(t.done?'checked':'')+' style="flex:0;width:18px;"><input type="text" data-list="tasks" data-field="task" data-idx="'+idx+'" value="'+esc(t.task)+'" placeholder="Tâche"><button class="rm" data-rm="tasks" data-idx="'+idx+'">✕</button></div>';}).join('')+
    '</div><button class="add-row" data-add="tasks">+ Ajouter une tâche</button></div>'+
    '<div class="card"><h3>Notes</h3><div class="field"><textarea data-f="notes" style="min-height:100px;">'+esc(p.notes)+'</textarea></div></div>';

  area.querySelectorAll('[data-f]').forEach(function(inp){ inp.addEventListener('input', function(){ p[inp.dataset.f]=inp.value; saveProd(); renderList(); }); });
  area.querySelectorAll('[data-list]').forEach(function(inp){ inp.addEventListener('input', function(){
    const list=inp.dataset.list, idx=+inp.dataset.idx, field=inp.dataset.field;
    if(list==='options') p.options[idx]=inp.value; else p.tasks[idx][field]=inp.value;
    saveProd();
  }); });
  area.querySelectorAll('[data-donechk]').forEach(function(cb){ cb.addEventListener('change', function(e){ p.tasks[+e.target.dataset.donechk].done=e.target.checked; saveProd(); }); });
  area.querySelectorAll('[data-add]').forEach(function(btn){ btn.addEventListener('click', function(){
    const list=btn.dataset.add;
    if(list==='options') p.options.push('');
    if(list==='tasks') p.tasks.push({task:'',done:false});
    saveProd(); renderProdEdit(p);
  }); });
  area.querySelectorAll('[data-rm]').forEach(function(btn){ btn.addEventListener('click', function(){
    const list=btn.dataset.rm, idx=+btn.dataset.idx; p[list].splice(idx,1); saveProd(); renderProdEdit(p);
  }); });
}

function renderGlobalPlanning(){
  const main = document.getElementById('main');
  let events = [];
  boats.forEach(function(b){
    if(b.pickupDate) events.push({date:b.pickupDate, type:"Sortie d'eau", module:'hivernage', id:b.id, label:(b.clientName||'Client')+' — '+(b.boatName||'Bateau'), tagClass:'type-tag-h'});
    if(b.hangarOutDate) events.push({date:b.hangarOutDate, type:'Sortie hangar', module:'hivernage', id:b.id, label:(b.clientName||'Client')+' — '+(b.boatName||'Bateau'), tagClass:'type-tag-h'});
    if(b.launchDatePlanned) events.push({date:b.launchDatePlanned, type:"Mise à l'eau", module:'hivernage', id:b.id, label:(b.clientName||'Client')+' — '+(b.boatName||'Bateau'), tagClass:'type-tag-h'});
  });
  prodJobs.forEach(function(p){
    if(p.receptionDate) events.push({date:p.receptionDate, type:'Prod — Réception', module:'prod', id:p.id, label:(p.client||'Client')+' — '+(p.title||'Dossier'), tagClass:'type-tag'});
    if(p.startDate) events.push({date:p.startDate, type:'Prod — Début', module:'prod', id:p.id, label:(p.client||'Client')+' — '+(p.title||'Dossier'), tagClass:'type-tag'});
    if(p.endDate) events.push({date:p.endDate, type:'Prod — Fin', module:'prod', id:p.id, label:(p.client||'Client')+' — '+(p.title||'Dossier'), tagClass:'type-tag'});
    if(p.deliveryDate) events.push({date:p.deliveryDate, type:'Prod — Livraison', module:'prod', id:p.id, label:(p.client||'Client')+' — '+(p.title||'Dossier'), tagClass:'type-tag'});
  });
  events.sort(function(a,c){ return a.date.localeCompare(c.date); });

  main.innerHTML =
    '<div class="card">'+
      '<h3>Planning général — toutes les échéances</h3>'+
      '<div class="section-intro">Sorties d\'eau, sorties hangar, mises à l\'eau (hivernage) et étapes de production, triées par date</div>'+
      '<table class="plan-table">'+
        '<tr><th style="width:110px;">Date</th><th style="width:170px;">Type</th><th>Concerne</th><th></th></tr>'+
        (events.length ? events.map(function(e){ return '<tr>'+
            '<td>'+fmtDate(e.date)+'</td>'+
            '<td><span class="type-tag '+e.tagClass+'">'+e.type+'</span></td>'+
            '<td>'+esc(e.label)+'</td>'+
            '<td><button class="btn btn-outline btn-small" data-open-mod="'+e.module+'" data-open-id="'+e.id+'">Ouvrir</button></td>'+
          '</tr>'; }).join('') : '<tr><td colspan="4" class="placeholder-italic">Aucune date renseignée pour le moment</td></tr>')+
      '</table>'+
    '</div>';
  main.querySelectorAll('[data-open-mod]').forEach(function(btn){ btn.addEventListener('click', function(){
    const mod = btn.dataset.openMod, id = btn.dataset.openId;
    if(mod==='hivernage'){ activeModule='hivernage'; hivSubTab='clients'; currentBoatId=id; currentTab='interne'; }
    else { activeModule='prod'; currentProdId=id; currentTab='detail'; }
    syncHeaderUI(); renderAll();
  }); });
}

loadAll();
</script>
</body>
</html>
