<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marine Compo — Plateforme</title>
<style>
  :root{
    --navy:#16324F;
    --navy-dark:#0E2338;
    --accent:#C97A3B;
    --bg:#F3F5F7;
    --card:#FFFFFF;
    --line:#E1E5EA;
    --text:#1E2A35;
    --muted:#6B7A88;
    --ok:#2E7D5B;
    --warn:#B4483A;
    --blue:#2C6FA8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  header{
    background:var(--navy);
    color:#fff;
    padding:12px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  header .left{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px;}
  header .sub{font-size:11.5px;color:#B9C6D3;font-weight:400;margin-top:2px;}
  .module-switch{display:flex;background:rgba(255,255,255,.1);border-radius:8px;padding:3px;gap:2px;}
  .module-btn{
    border:none;background:none;color:#CBD8E4;padding:7px 16px;border-radius:6px;
    font-size:13px;font-weight:600;cursor:pointer;
  }
  .module-btn.active{background:var(--accent);color:#fff;}
  .btn{border:none;border-radius:6px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:filter .15s ease;}
  .btn:hover{filter:brightness(1.08);}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-outline{background:#fff;color:var(--navy);border:1px solid var(--line);}
  .btn-outline:hover{background:#F0F3F6;}
  .btn-small{padding:5px 10px;font-size:12px;border-radius:5px;}
  .layout{display:flex;flex:1;min-height:0;}
  .sidebar{width:300px;min-width:260px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;}
  .sidebar .search{padding:12px;border-bottom:1px solid var(--line);}
  .sidebar input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;}
  .list{overflow-y:auto;flex:1;}
  .item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
  .item:hover{background:#F5F7F9;}
  .item.active{background:#EAF0F5;border-left:3px solid var(--accent);}
  .item .name{font-weight:700;font-size:13.5px;color:var(--navy);}
  .item .meta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .empty-list{padding:24px 16px;font-size:12.5px;color:var(--muted);text-align:center;}
  .main{flex:1;overflow-y:auto;padding:22px;}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);text-align:center;gap:10px;}
  .empty-state h2{color:var(--navy);font-size:18px;margin:0;}
  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .tab{padding:9px 16px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--navy);border-bottom-color:var(--accent);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px 22px;margin-bottom:16px;}
  .card h3{margin:0 0 14px 0;font-size:13.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--navy);background:#EAF0F5;padding:8px 10px;border-radius:5px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
  .grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px 14px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;}
  .field input[type=text],.field input[type=date],.field input[type=tel],.field input[type=email],.field select,.field textarea{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;font-family:inherit;background:#fff;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .row-list{display:flex;flex-direction:column;gap:8px;}
  .row-item{display:flex;gap:8px;align-items:center;}
  .row-item input{flex:1;}
  .row-item .rm{background:none;border:none;color:var(--warn);cursor:pointer;font-size:16px;padding:2px 6px;}
  .add-row{margin-top:6px;background:none;border:1px dashed var(--line);border-radius:6px;padding:7px 12px;font-size:12.5px;color:var(--navy);cursor:pointer;text-align:left;}
  .add-row:hover{background:#F5F7F9;}
  .photo-box{border:2px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted);font-size:12.5px;}
  .actions-bar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px;}
  .fiche-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:18px;}
  .fiche-header .brand{font-weight:800;color:var(--navy);font-size:15px;}
  .fiche-header .ficheType{font-size:12px;color:var(--muted);}
  .fiche-title{font-size:22px;font-weight:800;color:var(--navy);margin:0 0 4px 0;}
  .kv{display:grid;grid-template-columns:200px 1fr;font-size:13.5px;padding:6px 0;border-bottom:1px solid #F0F2F4;}
  .kv .k{color:var(--muted);font-weight:600;}
  .bullet-list{list-style:none;padding:0;margin:0;}
  .bullet-list li{padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .bullet-list li:before{content:"– ";color:var(--accent);font-weight:700;}
  table.fiche-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px;}
  table.fiche-table th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;font-size:12px;}
  table.fiche-table td{padding:8px 10px;border-bottom:1px solid var(--line);}
  table.fiche-table tr:nth-child(even) td{background:#FAFBFC;}
  .chk{width:18px;height:18px;cursor:pointer;}
  .status-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;}
  .status-ok{background:#E4F3EC;color:var(--ok);}
  .status-pending{background:#FBEAE8;color:var(--warn);}
  .status-progress{background:#E7F0F8;color:var(--blue);}
  .type-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:700;background:#F0EAE3;color:var(--accent);}
  .placeholder-italic{color:var(--muted);font-style:italic;font-size:12.5px;}
  .progress-bar{height:8px;background:#EAEDF0;border-radius:4px;overflow:hidden;margin-top:6px;}
  .progress-fill{height:100%;background:var(--accent);}
  .timeline{display:flex;justify-content:space-between;margin-top:6px;}
  .timeline .step{flex:1;text-align:center;font-size:11.5px;color:var(--muted);position:relative;}
  .timeline .step .dot{width:12px;height:12px;border-radius:50%;background:#D8DEE4;margin:0 auto 4px;}
  .timeline .step.done .dot{background:var(--ok);}
  .timeline .step .lbl{font-weight:700;color:var(--navy);}
  .timeline .step .dt{margin-top:2px;}

  @media print{
    header,.sidebar,.tabs,.actions-bar,.no-print{display:none !important;}
    .layout{display:block;}
    .main{padding:0;overflow:visible;}
    body{background:#fff;}
    .card{border:none;box-shadow:none;padding:0;margin-bottom:14px;}
  }
</style>
</head>
<body>

<header>
  <div class="left">
    <div>
      <h1>MARINE COMPO</h1>
      <div class="sub">Plateforme de suivi</div>
    </div>
    <div class="module-switch">
      <button class="module-btn active" data-module="hivernage">Hivernage</button>
      <button class="module-btn" data-module="prod">Prod</button>
    </div>
  </div>
  <button class="btn btn-accent" id="newItemBtn">+ Nouveau</button>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="search"><input type="text" id="searchInput" placeholder="Rechercher..."></div>
    <div class="list" id="listArea"></div>
  </div>
  <div class="main" id="main"></div>
</div>

<script>
let activeModule = 'hivernage';
let boats = [];
let prodJobs = [];
let currentBoatId = null;
let currentProdId = null;
let currentTab = 'interne';

function uid(p){ return p+'_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtDate(d){ if(!d) return ''; const p=d.split('-'); if(p.length!==3) return d; return `${p[2]}/${p[1]}/${p[0]}`; }

/* ================= BOAT (HIVERNAGE) MODEL ================= */
function emptyBoat(){
  return {
    id: uid('b'), ficheNumber:'', createdAt: new Date().toISOString().slice(0,10),
    clientName:'', clientNumber:'', clientPhone:'', clientEmail:'',
    boatType:'', boatNumber:'', boatName:'',
    requestDate:'', pickupDate:'', pickupLocation:'', buoyNumber:'', photo:'',
    requests: [], inventory: [], sailRack:'', gearShelf:'',
    tasks: [], techNotes: [],
    launchDatePlanned:'', launchDateActual:'', transmittedDate:'', responsable:''
  };
}

/* ================= PROD MODEL ================= */
function emptyProd(){
  return {
    id: uid('p'), dossierNumber:'', createdAt: new Date().toISOString().slice(0,10),
    type:'chantier', // chantier | fabrication
    title:'', client:'', reference:'', description:'',
    status:'a_faire', // a_faire | en_cours | fini
    receptionDate:'', startDate:'', endDate:'', deliveryDate:'',
    tasks: [], notes:''
  };
}

/* ================= STORAGE ================= */
async function loadAll(){
  try{ const r = await window.storage.get('boats', true); boats = r&&r.value?JSON.parse(r.value):[]; }catch(e){ boats=[]; }
  try{ const r = await window.storage.get('prodJobs', true); prodJobs = r&&r.value?JSON.parse(r.value):[]; }catch(e){ prodJobs=[]; }
  renderList(); renderMain();
}
async function saveBoats(){ try{ await window.storage.set('boats', JSON.stringify(boats), true); }catch(e){console.error(e);} }
async function saveProd(){ try{ await window.storage.set('prodJobs', JSON.stringify(prodJobs), true); }catch(e){console.error(e);} }

/* ================= MODULE SWITCH ================= */
document.querySelectorAll('.module-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    activeModule = btn.dataset.module;
    document.querySelectorAll('.module-btn').forEach(b=>b.classList.toggle('active', b===btn));
    currentTab = activeModule==='hivernage' ? 'interne' : 'detail';
    document.getElementById('searchInput').value = '';
    renderList(); renderMain();
  });
});

document.getElementById('newItemBtn').addEventListener('click', async ()=>{
  if(activeModule==='hivernage'){
    const nb = emptyBoat();
    nb.ficheNumber = 'H-' + (boats.length+1).toString().padStart(3,'0');
    boats.push(nb); currentBoatId = nb.id; currentTab='edit';
    await saveBoats();
  } else {
    const np = emptyProd();
    np.dossierNumber = 'P-' + (prodJobs.length+1).toString().padStart(3,'0');
    prodJobs.push(np); currentProdId = np.id; currentTab='edit';
    await saveProd();
  }
  renderList(); renderMain();
});

document.getElementById('searchInput').addEventListener('input', renderList);

/* ================= LIST RENDER ================= */
function renderList(){
  const el = document.getElementById('listArea');
  const q = (document.getElementById('searchInput').value||'').toLowerCase();

  if(activeModule==='hivernage'){
    const filtered = boats.filter(b => (b.clientName||'').toLowerCase().includes(q) || (b.boatName||'').toLowerCase().includes(q) || (b.boatNumber||'').toLowerCase().includes(q))
      .sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
    if(!filtered.length){ el.innerHTML = '<div class="empty-list">Aucun bateau enregistré. Cliquez sur "+ Nouveau" pour commencer.</div>'; return; }
    el.innerHTML = filtered.map(b=>`
      <div class="item ${b.id===currentBoatId?'active':''}" data-id="${b.id}">
        <div class="name">${esc(b.clientName||'Client sans nom')}</div>
        <div class="meta">${esc(b.boatName||'Bateau sans nom')} ${b.boatNumber?'· '+esc(b.boatNumber):''}</div>
        <div class="meta">${b.pickupDate?'Sortie : '+fmtDate(b.pickupDate):'Date non définie'}</div>
      </div>`).join('');
    el.querySelectorAll('.item').forEach(it=>{
      it.addEventListener('click', ()=>{ currentBoatId = it.dataset.id; currentTab='interne'; renderList(); renderMain(); });
    });
  } else {
    const filtered = prodJobs.filter(p => (p.client||'').toLowerCase().includes(q) || (p.title||'').toLowerCase().includes(q) || (p.reference||'').toLowerCase().includes(q))
      .sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
    if(!filtered.length){ el.innerHTML = '<div class="empty-list">Aucun dossier de prod. Cliquez sur "+ Nouveau" pour commencer.</div>'; return; }
    el.innerHTML = filtered.map(p=>`
      <div class="item ${p.id===currentProdId?'active':''}" data-id="${p.id}">
        <div class="name">${esc(p.title||'Dossier sans nom')}</div>
        <div class="meta"><span class="type-tag">${p.type==='chantier'?'Chantier':'Fabrication'}</span> ${statusBadge(p.status)}</div>
        <div class="meta">${esc(p.client||'Client non renseigné')}</div>
      </div>`).join('');
    el.querySelectorAll('.item').forEach(it=>{
      it.addEventListener('click', ()=>{ currentProdId = it.dataset.id; currentTab='detail'; renderList(); renderMain(); });
    });
  }
}

function statusBadge(status){
  const map = { a_faire:['status-pending','À faire'], en_cours:['status-progress','En cours'], fini:['status-ok','Terminé'] };
  const [cls,label] = map[status] || map.a_faire;
  return `<span class="status-tag ${cls}">${label}</span>`;
}

/* ================= MAIN RENDER DISPATCH ================= */
function renderMain(){
  if(activeModule==='hivernage') renderBoatMain(); else renderProdMain();
}

/* ================= HIVERNAGE: MAIN ================= */
function getCurrentBoat(){ return boats.find(b=>b.id===currentBoatId) || null; }

function renderBoatMain(){
  const main = document.getElementById('main');
  const b = getCurrentBoat();
  if(!b){
    main.innerHTML = `<div class="empty-state"><h2>Aucun bateau sélectionné</h2><p>Choisissez un bateau dans la liste, ou créez-en un nouveau.</p><button class="btn btn-accent" onclick="document.getElementById('newItemBtn').click()">+ Nouveau bateau</button></div>`;
    return;
  }
  main.innerHTML = `
    <div class="tabs no-print">
      <div class="tab ${currentTab==='interne'?'active':''}" data-tab="interne">Fiche interne</div>
      <div class="tab ${currentTab==='terrain'?'active':''}" data-tab="terrain">Fiche terrain</div>
      <div class="tab ${currentTab==='edit'?'active':''}" data-tab="edit">Modifier / Saisie</div>
    </div>
    <div class="actions-bar no-print">
      ${currentTab!=='edit' ? '<button class="btn btn-outline btn-small" id="printBtn">Imprimer cette fiche</button>' : ''}
      <button class="btn btn-outline btn-small" id="deleteBtn" style="color:#B4483A;">Supprimer</button>
    </div>
    <div id="ficheArea"></div>`;
  main.querySelectorAll('.tab').forEach(t=> t.addEventListener('click', ()=>{ currentTab=t.dataset.tab; renderBoatMain(); }));
  const pb = document.getElementById('printBtn'); if(pb) pb.addEventListener('click', ()=>window.print());
  document.getElementById('deleteBtn').addEventListener('click', async ()=>{
    if(confirm(`Supprimer la fiche de "${b.clientName||'ce bateau'}" ?`)){
      boats = boats.filter(x=>x.id!==b.id); currentBoatId=null; await saveBoats(); renderList(); renderMain();
    }
  });
  if(currentTab==='interne') renderBoatInterne(b);
  else if(currentTab==='terrain') renderBoatTerrain(b);
  else renderBoatEdit(b);
}

function renderBoatInterne(b){
  const area = document.getElementById('ficheArea');
  area.innerHTML = `
    <div class="card">
      <div class="fiche-header">
        <div><div class="brand">MARINE COMPO</div><div class="fiche-title">Fiche interne — ${esc(b.clientName||'Client')}</div></div>
        <div class="ficheType">Usage interne · créée le ${fmtDate(b.createdAt)}</div>
      </div>
      <h3>Client</h3>
      <div class="kv"><div class="k">Nom du client</div><div>${esc(b.clientName)||'—'}</div></div>
      <div class="kv"><div class="k">N° client</div><div>${esc(b.clientNumber)||'—'}</div></div>
      <div class="kv"><div class="k">Téléphone</div><div>${esc(b.clientPhone)||'—'}</div></div>
      <div class="kv"><div class="k">Email</div><div>${esc(b.clientEmail)||'—'}</div></div>
      <h3 style="margin-top:18px;">Bateau</h3>
      <div class="kv"><div class="k">Type de bateau</div><div>${esc(b.boatType)||'—'}</div></div>
      <div class="kv"><div class="k">N° du bateau</div><div>${esc(b.boatNumber)||'—'}</div></div>
      <div class="kv"><div class="k">Nom du bateau</div><div>${esc(b.boatName)||'—'}</div></div>
      <h3 style="margin-top:18px;">Sortie du bateau</h3>
      <div class="kv"><div class="k">Date de réception demande</div><div>${fmtDate(b.requestDate)||'—'}</div></div>
      <div class="kv"><div class="k">Date de sortie souhaitée</div><div>${fmtDate(b.pickupDate)||'—'}</div></div>
      <div class="kv"><div class="k">Lieu de récupération</div><div>${esc(b.pickupLocation)||'—'}</div></div>
      <div class="kv"><div class="k">N° de boule / emplacement</div><div>${esc(b.buoyNumber)||'—'}</div></div>
      <div style="margin-top:12px;">${b.photo?`<img src="${b.photo}" style="max-width:320px;border-radius:8px;border:1px solid #E1E5EA;">`:`<div class="photo-box">Aucune photo du lieu ajoutée</div>`}</div>
    </div>
    <div class="card"><h3>Emplacements</h3>
      <div class="kv"><div class="k">Rack voiles</div><div>${esc(b.sailRack)||'—'}</div></div>
      <div class="kv"><div class="k">Étagère affaires du bateau</div><div>${esc(b.gearShelf)||'—'}</div></div>
    </div>
    <div class="card"><h3>Demandes du client</h3>
      ${b.requests.length?`<ul class="bullet-list">${b.requests.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:`<div class="placeholder-italic">Aucune demande enregistrée</div>`}
    </div>
    <div class="card"><h3>Travaux à réaliser</h3>
      ${b.tasks.length?`<table class="fiche-table"><tr><th>Tâche</th><th style="width:140px;">Date prévue</th></tr>${b.tasks.map(t=>`<tr><td>${esc(t.task)}</td><td>${fmtDate(t.dueDate)||'—'}</td></tr>`).join('')}</table>`:`<div class="placeholder-italic">Aucune tâche enregistrée</div>`}
    </div>
    <div class="card"><h3>Inventaire du bateau</h3>
      ${b.inventory.length?`<table class="fiche-table"><tr><th>Désignation</th><th>Emplacement / remarque</th></tr>${b.inventory.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.location)}</td></tr>`).join('')}</table>`:`<div class="placeholder-italic">Aucun objet enregistré</div>`}
    </div>
    <div class="card"><h3>Points relevés par nos soins</h3>
      ${b.techNotes.length?`<table class="fiche-table"><tr><th>Constat</th><th>Action réalisée</th><th style="width:110px;">Date</th></tr>${b.techNotes.map(n=>`<tr><td>${esc(n.constat)}</td><td>${esc(n.action)}</td><td>${fmtDate(n.date)||'—'}</td></tr>`).join('')}</table>`:`<div class="placeholder-italic">Aucun point relevé</div>`}
    </div>
    <div class="card"><h3>Mise à l'eau</h3>
      <div class="kv"><div class="k">Date de mise à l'eau prévue</div><div>${fmtDate(b.launchDatePlanned)||'—'}</div></div>
      <div class="kv"><div class="k">Transmis au responsable le</div><div>${fmtDate(b.transmittedDate)||'—'}</div></div>
    </div>`;
}

function renderBoatTerrain(b){
  const area = document.getElementById('ficheArea');
  const doneTasks = b.tasks.filter(t=>t.done).length;
  const okInv = b.inventory.filter(i=>i.checked).length;
  const doneReq = b.requests.filter((r,idx)=>b._reqDone&&b._reqDone[idx]).length;
  area.innerHTML = `
    <div class="card">
      <div class="fiche-header"><div><div class="brand">MARINE COMPO</div><div class="fiche-title">Fiche terrain — Mise à l'eau</div></div><div class="ficheType">À cocher au fur et à mesure</div></div>
      <div class="kv"><div class="k">Bateau</div><div>${esc(b.boatName)||'—'} ${b.boatNumber?'('+esc(b.boatNumber)+')':''}</div></div>
      <div class="kv"><div class="k">Client</div><div>${esc(b.clientName)||'—'}</div></div>
      <div class="kv"><div class="k">Rack voiles</div><div>${esc(b.sailRack)||'—'}</div></div>
      <div class="kv"><div class="k">Étagère affaires</div><div>${esc(b.gearShelf)||'—'}</div></div>
    </div>
    <div class="card"><h3>Travaux à réaliser avant mise à l'eau <span class="status-tag ${doneTasks===b.tasks.length&&b.tasks.length?'status-ok':'status-pending'}">${doneTasks}/${b.tasks.length} faits</span></h3>
      ${b.tasks.length?`<table class="fiche-table"><tr><th>Tâche</th><th style="width:120px;">Date prévue</th><th style="width:70px;">Fait</th></tr>${b.tasks.map((t,idx)=>`<tr><td>${esc(t.task)}</td><td>${fmtDate(t.dueDate)||'—'}</td><td><input type="checkbox" class="chk" data-kind="task" data-idx="${idx}" ${t.done?'checked':''}></td></tr>`).join('')}</table>`:`<div class="placeholder-italic">Aucune tâche enregistrée</div>`}
    </div>
    <div class="card"><h3>Vérification de l'inventaire <span class="status-tag ${okInv===b.inventory.length&&b.inventory.length?'status-ok':'status-pending'}">${okInv}/${b.inventory.length} présents</span></h3>
      ${b.inventory.length?`<table class="fiche-table"><tr><th>Désignation</th><th>Emplacement / remarque</th><th style="width:70px;">Présent</th></tr>${b.inventory.map((i,idx)=>`<tr><td>${esc(i.name)}</td><td>${esc(i.location)}</td><td><input type="checkbox" class="chk" data-kind="inv" data-idx="${idx}" ${i.checked?'checked':''}></td></tr>`).join('')}</table>`:`<div class="placeholder-italic">Aucun objet enregistré</div>`}
    </div>
    <div class="card"><h3>Demandes du client <span class="status-tag ${doneReq===b.requests.length&&b.requests.length?'status-ok':'status-pending'}">${doneReq}/${b.requests.length} réalisées</span></h3>
      ${b.requests.length?`<table class="fiche-table"><tr><th>Demande</th><th style="width:70px;">Réalisé</th></tr>${b.requests.map((r,idx)=>`<tr><td>${esc(r)}</td><td><input type="checkbox" class="chk" data-kind="req" data-idx="${idx}" ${(b._reqDone&&b._reqDone[idx])?'checked':''}></td></tr>`).join('')}</table>`:`<div class="placeholder-italic">Aucune demande enregistrée</div>`}
    </div>
    <div class="card"><h3>Mise à l'eau</h3>
      <div class="grid2">
        <div class="field"><label>Date de mise à l'eau</label><input type="date" id="f_launchDateActual" value="${b.launchDateActual||''}"></div>
        <div class="field"><label>Responsable / signature</label><input type="text" id="f_responsable" value="${esc(b.responsable)}"></div>
      </div>
    </div>`;
  area.querySelectorAll('.chk').forEach(cb=>{
    cb.addEventListener('change', async e=>{
      const kind=e.target.dataset.kind, idx=+e.target.dataset.idx;
      if(kind==='task') b.tasks[idx].done=e.target.checked;
      if(kind==='inv') b.inventory[idx].checked=e.target.checked;
      if(kind==='req'){ if(!b._reqDone) b._reqDone=[]; b._reqDone[idx]=e.target.checked; }
      await saveBoats(); renderBoatTerrain(b);
    });
  });
  document.getElementById('f_launchDateActual').addEventListener('change', async e=>{ b.launchDateActual=e.target.value; await saveBoats(); });
  document.getElementById('f_responsable').addEventListener('change', async e=>{ b.responsable=e.target.value; await saveBoats(); });
}

function renderBoatEdit(b){
  const area = document.getElementById('ficheArea');
  area.innerHTML = `
    <div class="card"><h3>Client</h3><div class="grid2">
      <div class="field"><label>Nom du client</label><input type="text" data-f="clientName" value="${esc(b.clientName)}"></div>
      <div class="field"><label>N° client</label><input type="text" data-f="clientNumber" value="${esc(b.clientNumber)}"></div>
      <div class="field"><label>Téléphone</label><input type="tel" data-f="clientPhone" value="${esc(b.clientPhone)}"></div>
      <div class="field"><label>Email</label><input type="email" data-f="clientEmail" value="${esc(b.clientEmail)}"></div>
    </div></div>
    <div class="card"><h3>Bateau</h3><div class="grid2">
      <div class="field"><label>Type de bateau</label><input type="text" data-f="boatType" value="${esc(b.boatType)}"></div>
      <div class="field"><label>N° du bateau</label><input type="text" data-f="boatNumber" value="${esc(b.boatNumber)}"></div>
      <div class="field"><label>Nom du bateau</label><input type="text" data-f="boatName" value="${esc(b.boatName)}"></div>
    </div></div>
    <div class="card"><h3>Sortie du bateau</h3><div class="grid2">
      <div class="field"><label>Date de réception demande</label><input type="date" data-f="requestDate" value="${b.requestDate}"></div>
      <div class="field"><label>Date de sortie souhaitée</label><input type="date" data-f="pickupDate" value="${b.pickupDate}"></div>
      <div class="field"><label>Lieu de récupération</label><input type="text" data-f="pickupLocation" value="${esc(b.pickupLocation)}"></div>
      <div class="field"><label>N° de boule / emplacement</label><input type="text" data-f="buoyNumber" value="${esc(b.buoyNumber)}"></div>
    </div>
    <div class="field" style="margin-top:12px;"><label>Photo du lieu de récupération</label>
      ${b.photo?`<div style="margin-bottom:8px;"><img src="${b.photo}" style="max-width:260px;border-radius:6px;border:1px solid #E1E5EA;"></div>`:''}
      <input type="file" id="photoInput" accept="image/*">
    </div></div>
    <div class="card"><h3>Emplacements</h3><div class="grid2">
      <div class="field"><label>Rack voiles — N°</label><input type="text" data-f="sailRack" value="${esc(b.sailRack)}"></div>
      <div class="field"><label>Étagère affaires du bateau — N°</label><input type="text" data-f="gearShelf" value="${esc(b.gearShelf)}"></div>
    </div></div>
    <div class="card"><h3>Demandes du client</h3><div class="row-list" id="requestsList">
      ${b.requests.map((r,idx)=>`<div class="row-item"><input type="text" data-list="requests" data-idx="${idx}" value="${esc(r)}" placeholder="Ex : nettoyer la coque"><button class="rm" data-rm="requests" data-idx="${idx}">✕</button></div>`).join('')}
    </div><button class="add-row" data-add="requests">+ Ajouter une demande</button></div>
    <div class="card"><h3>Inventaire du bateau à l'arrivée</h3><div class="row-list" id="inventoryList">
      ${b.inventory.map((i,idx)=>`<div class="row-item"><input type="text" data-list="inventory" data-field="name" data-idx="${idx}" value="${esc(i.name)}" placeholder="Objet" style="flex:2;"><input type="text" data-list="inventory" data-field="location" data-idx="${idx}" value="${esc(i.location)}" placeholder="Emplacement / remarque" style="flex:2;"><button class="rm" data-rm="inventory" data-idx="${idx}">✕</button></div>`).join('')}
    </div><button class="add-row" data-add="inventory">+ Ajouter un objet</button></div>
    <div class="card"><h3>Travaux à réaliser avant mise à l'eau</h3><div class="row-list" id="tasksList">
      ${b.tasks.map((t,idx)=>`<div class="row-item"><input type="text" data-list="tasks" data-field="task" data-idx="${idx}" value="${esc(t.task)}" placeholder="Tâche" style="flex:3;"><input type="date" data-list="tasks" data-field="dueDate" data-idx="${idx}" value="${t.dueDate||''}" style="flex:1;"><button class="rm" data-rm="tasks" data-idx="${idx}">✕</button></div>`).join('')}
    </div><button class="add-row" data-add="tasks">+ Ajouter une tâche</button></div>
    <div class="card"><h3>Points relevés par nos soins</h3><div class="row-list" id="notesList">
      ${b.techNotes.map((n,idx)=>`<div class="row-item"><input type="text" data-list="techNotes" data-field="constat" data-idx="${idx}" value="${esc(n.constat)}" placeholder="Constat" style="flex:2;"><input type="text" data-list="techNotes" data-field="action" data-idx="${idx}" value="${esc(n.action)}" placeholder="Action réalisée" style="flex:2;"><input type="date" data-list="techNotes" data-field="date" data-idx="${idx}" value="${n.date||''}" style="flex:1;"><button class="rm" data-rm="techNotes" data-idx="${idx}">✕</button></div>`).join('')}
    </div><button class="add-row" data-add="techNotes">+ Ajouter un point</button></div>
    <div class="card"><h3>Mise à l'eau</h3><div class="grid2">
      <div class="field"><label>Date de mise à l'eau prévue</label><input type="date" data-f="launchDatePlanned" value="${b.launchDatePlanned}"></div>
      <div class="field"><label>Transmis au responsable le</label><input type="date" data-f="transmittedDate" value="${b.transmittedDate}"></div>
    </div></div>`;

  area.querySelectorAll('[data-f]').forEach(inp=> inp.addEventListener('input', async ()=>{ b[inp.dataset.f]=inp.value; await saveBoats(); renderList(); }));
  const photoInput = document.getElementById('photoInput');
  if(photoInput) photoInput.addEventListener('change', e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{ b.photo=reader.result; await saveBoats(); renderBoatEdit(b); };
    reader.readAsDataURL(file);
  });
  area.querySelectorAll('[data-list]').forEach(inp=> inp.addEventListener('input', async ()=>{
    const list=inp.dataset.list, idx=+inp.dataset.idx, field=inp.dataset.field;
    if(list==='requests') b.requests[idx]=inp.value; else b[list][idx][field]=inp.value;
    await saveBoats();
  }));
  area.querySelectorAll('[data-add]').forEach(btn=> btn.addEventListener('click', async ()=>{
    const list=btn.dataset.add;
    if(list==='requests') b.requests.push('');
    if(list==='inventory') b.inventory.push({name:'',location:'',checked:false});
    if(list==='tasks') b.tasks.push({task:'',dueDate:'',done:false});
    if(list==='techNotes') b.techNotes.push({constat:'',action:'',date:''});
    await saveBoats(); renderBoatEdit(b);
  }));
  area.querySelectorAll('[data-rm]').forEach(btn=> btn.addEventListener('click', async ()=>{
    const list=btn.dataset.rm, idx=+btn.dataset.idx;
    b[list].splice(idx,1); await saveBoats(); renderBoatEdit(b);
  }));
}

/* ================= PROD: MAIN ================= */
function getCurrentProd(){ return prodJobs.find(p=>p.id===currentProdId) || null; }

function renderProdMain(){
  const main = document.getElementById('main');
  const p = getCurrentProd();
  if(!p){
    main.innerHTML = `<div class="empty-state"><h2>Aucun dossier sélectionné</h2><p>Choisissez un dossier dans la liste, ou créez-en un nouveau.</p><button class="btn btn-accent" onclick="document.getElementById('newItemBtn').click()">+ Nouveau dossier</button></div>`;
    return;
  }
  main.innerHTML = `
    <div class="tabs no-print">
      <div class="tab ${currentTab==='detail'?'active':''}" data-tab="detail">Suivi du dossier</div>
      <div class="tab ${currentTab==='edit'?'active':''}" data-tab="edit">Modifier / Saisie</div>
    </div>
    <div class="actions-bar no-print">
      ${currentTab!=='edit' ? '<button class="btn btn-outline btn-small" id="printBtn">Imprimer</button>' : ''}
      <button class="btn btn-outline btn-small" id="deleteBtn" style="color:#B4483A;">Supprimer</button>
    </div>
    <div id="prodArea"></div>`;
  main.querySelectorAll('.tab').forEach(t=> t.addEventListener('click', ()=>{ currentTab=t.dataset.tab; renderProdMain(); }));
  const pb = document.getElementById('printBtn'); if(pb) pb.addEventListener('click', ()=>window.print());
  document.getElementById('deleteBtn').addEventListener('click', async ()=>{
    if(confirm(`Supprimer le dossier "${p.title||'sans nom'}" ?`)){
      prodJobs = prodJobs.filter(x=>x.id!==p.id); currentProdId=null; await saveProd(); renderList(); renderMain();
    }
  });
  if(currentTab==='detail') renderProdDetail(p); else renderProdEdit(p);
}

function renderProdDetail(p){
  const area = document.getElementById('prodArea');
  const doneTasks = p.tasks.filter(t=>t.done).length;
  const pct = p.tasks.length ? Math.round(doneTasks/p.tasks.length*100) : 0;
  const steps = [
    {key:'receptionDate', lbl:'Réception'},
    {key:'startDate', lbl:'Début'},
    {key:'endDate', lbl:'Fin'},
    {key:'deliveryDate', lbl:'Livraison'},
  ];
  area.innerHTML = `
    <div class="card">
      <div class="fiche-header">
        <div><div class="brand">MARINE COMPO</div><div class="fiche-title">${esc(p.title||'Dossier')}</div></div>
        <div class="ficheType">${p.dossierNumber} · créé le ${fmtDate(p.createdAt)}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
        <span class="type-tag">${p.type==='chantier'?'Chantier':'Fabrication'}</span>
        ${statusBadge(p.status)}
      </div>
      <div class="kv"><div class="k">Client</div><div>${esc(p.client)||'—'}</div></div>
      <div class="kv"><div class="k">Référence (bateau / pièce)</div><div>${esc(p.reference)||'—'}</div></div>
      <div class="kv"><div class="k">Description</div><div>${esc(p.description)||'—'}</div></div>

      <h3 style="margin-top:18px;">Étapes</h3>
      <div class="timeline">
        ${steps.map(s=>`<div class="step ${p[s.key]?'done':''}"><div class="dot"></div><div class="lbl">${s.lbl}</div><div class="dt">${fmtDate(p[s.key])||'—'}</div></div>`).join('')}
      </div>
    </div>

    <div class="card">
      <h3>Avancement des tâches <span class="status-tag ${pct===100&&p.tasks.length?'status-ok':'status-progress'}">${doneTasks}/${p.tasks.length} (${pct}%)</span></h3>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;"></div></div>
      ${p.tasks.length ? `<table class="fiche-table" style="margin-top:12px;"><tr><th>Tâche</th><th style="width:80px;">Fait</th></tr>
        ${p.tasks.map((t,idx)=>`<tr><td>${esc(t.task)}</td><td><input type="checkbox" class="chk" data-idx="${idx}" ${t.done?'checked':''}></td></tr>`).join('')}
      </table>` : `<div class="placeholder-italic">Aucune tâche enregistrée</div>`}
    </div>

    <div class="card">
      <h3>Statut du dossier</h3>
      <div class="field" style="max-width:260px;">
        <select id="statusSelect">
          <option value="a_faire" ${p.status==='a_faire'?'selected':''}>À faire</option>
          <option value="en_cours" ${p.status==='en_cours'?'selected':''}>En cours</option>
          <option value="fini" ${p.status==='fini'?'selected':''}>Terminé</option>
        </select>
      </div>
    </div>

    <div class="card"><h3>Notes</h3>
      ${p.notes ? `<div style="font-size:13.5px;white-space:pre-wrap;">${esc(p.notes)}</div>` : `<div class="placeholder-italic">Aucune note</div>`}
    </div>
  `;
  area.querySelectorAll('.chk').forEach(cb=> cb.addEventListener('change', async e=>{
    p.tasks[+e.target.dataset.idx].done = e.target.checked;
    await saveProd(); renderProdDetail(p); renderList();
  }));
  document.getElementById('statusSelect').addEventListener('change', async e=>{
    p.status = e.target.value; await saveProd(); renderProdDetail(p); renderList();
  });
}

function renderProdEdit(p){
  const area = document.getElementById('prodArea');
  area.innerHTML = `
    <div class="card"><h3>Identification</h3><div class="grid2">
      <div class="field"><label>Type de dossier</label>
        <select data-f="type">
          <option value="chantier" ${p.type==='chantier'?'selected':''}>Chantier (réparation bateau)</option>
          <option value="fabrication" ${p.type==='fabrication'?'selected':''}>Fabrication (pièce composite)</option>
        </select>
      </div>
      <div class="field"><label>Titre du dossier</label><input type="text" data-f="title" value="${esc(p.title)}" placeholder="Ex : Réfection safran - Voilier Iroise"></div>
      <div class="field"><label>Client</label><input type="text" data-f="client" value="${esc(p.client)}"></div>
      <div class="field"><label>Référence (bateau / pièce)</label><input type="text" data-f="reference" value="${esc(p.reference)}"></div>
    </div>
    <div class="field" style="margin-top:12px;"><label>Description</label><textarea data-f="description">${esc(p.description)}</textarea></div>
    </div>

    <div class="card"><h3>Étapes / dates</h3><div class="grid4">
      <div class="field"><label>Réception</label><input type="date" data-f="receptionDate" value="${p.receptionDate}"></div>
      <div class="field"><label>Début</label><input type="date" data-f="startDate" value="${p.startDate}"></div>
      <div class="field"><label>Fin</label><input type="date" data-f="endDate" value="${p.endDate}"></div>
      <div class="field"><label>Livraison</label><input type="date" data-f="deliveryDate" value="${p.deliveryDate}"></div>
    </div></div>

    <div class="card"><h3>Statut</h3><div class="field" style="max-width:260px;">
      <select data-f="status">
        <option value="a_faire" ${p.status==='a_faire'?'selected':''}>À faire</option>
        <option value="en_cours" ${p.status==='en_cours'?'selected':''}>En cours</option>
        <option value="fini" ${p.status==='fini'?'selected':''}>Terminé</option>
      </select>
    </div></div>

    <div class="card"><h3>Checklist des tâches</h3><div class="row-list" id="tasksList">
      ${p.tasks.map((t,idx)=>`<div class="row-item">
        <input type="checkbox" data-donechk="${idx}" ${t.done?'checked':''} style="flex:0;width:18px;">
        <input type="text" data-list="tasks" data-field="task" data-idx="${idx}" value="${esc(t.task)}" placeholder="Tâche">
        <button class="rm" data-rm="tasks" data-idx="${idx}">✕</button>
      </div>`).join('')}
    </div><button class="add-row" data-add="tasks">+ Ajouter une tâche</button></div>

    <div class="card"><h3>Notes</h3><div class="field"><textarea data-f="notes" style="min-height:100px;">${esc(p.notes)}</textarea></div></div>
  `;

  area.querySelectorAll('[data-f]').forEach(inp=> inp.addEventListener('input', async ()=>{ p[inp.dataset.f]=inp.value; await saveProd(); renderList(); }));
  area.querySelectorAll('[data-list]').forEach(inp=> inp.addEventListener('input', async ()=>{
    const idx=+inp.dataset.idx, field=inp.dataset.field; p.tasks[idx][field]=inp.value; await saveProd();
  }));
  area.querySelectorAll('[data-donechk]').forEach(cb=> cb.addEventListener('change', async e=>{
    p.tasks[+e.target.dataset.donechk].done = e.target.checked; await saveProd();
  }));
  area.querySelectorAll('[data-add]').forEach(btn=> btn.addEventListener('click', async ()=>{
    p.tasks.push({task:'',done:false}); await saveProd(); renderProdEdit(p);
  }));
  area.querySelectorAll('[data-rm]').forEach(btn=> btn.addEventListener('click', async ()=>{
    p.tasks.splice(+btn.dataset.idx,1); await saveProd(); renderProdEdit(p);
  }));
}

loadAll();
</script>
